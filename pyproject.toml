[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ama-disaster-response-hub"
version = "0.1.0"
description = "Workspace metadata for the Autonomous Disaster Response Coordination Hub"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.138.0,<1",
  "pydantic>=2.10.0",
  "azure-cosmos>=4.9.0",
  "azure-storage-blob>=12.24.0",
  "azure-identity>=1.19.0",
  "cryptography>=50.0.0,<51",
  "Pygments>=2.20.0",
  "requests>=2.33.0",
  # Spec-037 (T002, RES-01, FR-009) — JSON Schema draft 2020-12 validation
  # for evidence-pack artefacts + YAML loader for the publication-gate config.
  "jsonschema>=4.21",
  "pyyaml>=6.0",
  # Spec-039 (T001, FR-022) — RFC 8785 JSON Canonicalisation Scheme for
  # deterministic byte-identical NDJSON encoding (canonical JSON, sorted keys).
  "rfc8785>=0.1.4",
]

[project.optional-dependencies]
dev = [
  "ama-disaster-response-agents",
  "ama-disaster-response-api",
  "ama-disaster-response-ingest-runner",
  "ama-disaster-response-ingestion",
  "ama-eval-core",
  "ama-eval-dataset",
  "ama-eval-runner",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-asyncio>=0.24",
  "pytest-benchmark>=5.1",
  "hypothesis>=6.0",
  "ruff>=0.8.4",
  "mypy>=1.13",
  "import-linter>=2.0",
  "pre-commit>=4.0",
  "pre-commit-hooks>=5.0",
  "types-pyyaml>=6.0.12",
  "pyyaml>=6.0",
]
# Spec 036 / F-A10 / T219 + T224 — load-test extras (FR-RAG-TEST-02).
load = [
  "locust>=2.31,<3",
  "psutil>=6.0,<8",
]

[tool.uv]
package = false
override-dependencies = [
  "mem0ai>=2.0.0b2",
  # redis-entraid 1.2.1 excludes newer PyJWT 2.x releases even though it uses
  # compatible public APIs; force the security-patched version across the workspace.
  "pyjwt>=2.14.0,<3",
]

[tool.uv.sources]
ama-disaster-response-agents = { path = "apps/agents", editable = true }
ama-disaster-response-api = { path = "apps/api", editable = true }
ama-disaster-response-ingest-runner = { path = "apps/ingest-runner", editable = true }
ama-disaster-response-ingestion = { path = "apps/ingestion", editable = true }
ama-eval-core = { path = "packages/eval-core", editable = true }
ama-eval-dataset = { path = "packages/eval-dataset", editable = true }
ama-eval-runner = { path = "apps/eval-runner", editable = true }

[[tool.uv.index]]
name = "microsoft-package-feed-proxy"
url = "https://packagefeedproxy.microsoft.io/pypi/simple"
default = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "strict"
markers = [
  "integration: integration tests requiring mock external services (Cosmos DB, Service Bus)",
  "simulation: extended scenario simulation tests",
  # Spec-036 staging gates — auto-skipped locally / in CI; run only when the matching
  # Azure resource is provisioned and the env var below is set to '1'.
  "azure_staging: requires APIM + Redis live telemetry. Env: AMA_STAGING_AZURE=1.",
  "azure_foundry_staging: requires Azure OpenAI gpt-4o / gpt-4o-mini deployment. Env: AMA_STAGING_FOUNDRY=1.",
  "azure_cosmos_staging: requires Azure Cosmos DB w/ ETag concurrency. Env: AMA_STAGING_COSMOS=1.",
  "azure_speech_staging: requires Azure AI Speech Services. Env: AMA_STAGING_SPEECH=1.",
  "azure_blob_worm_staging: requires Azure Blob Storage with immutability policy. Env: AMA_STAGING_BLOB_WORM=1.",
  "locust: load-test scripts intended for Locust runner / workflow_dispatch only.",
  "measurement_staging: paired-exercise / SC measurement harnesses (long-running, staging only). Env: AMA_STAGING_MEASUREMENT=1.",
  "axe_a11y: axe-core a11y assertions (delegated to pnpm test:a11y in CI).",
  "unit: fast in-process tests with no external deps (Spec 036 / F-A10 / T223)",
  "contract: contract tests proving schema / API parity (Spec 036 / F-A10 / T223)",
  "e2e: end-to-end tests requiring deployed infra (Spec 036 / F-A10 / T223)",
  "load: load / stress harnesses (Spec 036 / F-A10 / T223)",
  "spec007_isolation: required simulation tenant-isolation behavioral release gate.",
]

# ────────────────────────────────────────────────────────────────────────────────
# Spec-032 Stream 1 — Code-quality gates (FR-Q01..FR-Q05).
# These tools mirror the CI gates in .github/workflows/ci.yml and .pre-commit-config.yaml.
# ────────────────────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["apps", "packages"]
branch = true
omit = [
  "*/tests/*",
  "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false
warn_return_any = false
files = ["apps", "packages"]
exclude = "(^|[/\\\\])tests([/\\\\]|$)"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

# Import-linter rules (FR-Q02). Keep narrow and provable; expand as the codebase matures.
[tool.importlinter]
root_packages = ["apps", "packages"]

[[tool.importlinter.contracts]]
name = "agents do not depend on api"
type = "forbidden"
source_modules = ["apps.agents"]
forbidden_modules = ["apps.api"]

[[tool.importlinter.contracts]]
name = "ingestion does not depend on api"
type = "forbidden"
source_modules = ["apps.ingestion"]
forbidden_modules = ["apps.api"]

[[tool.importlinter.contracts]]
name = "domain does not depend on apps"
type = "forbidden"
source_modules = ["packages.domain"]
forbidden_modules = ["apps"]

# NOTE: packages/prompts/ is a YAML-asset directory (no Python module), so it
# has no imports to lint. Re-add a contract here only if Python code is added
# under packages/prompts/.

# ────────────────────────────────────────────────────────────────────────────────
# Spec-039 / Two-Path Rule (SC-007, plan §"Two-Path Rule").
# Production code MUST NOT import the simulator package, and runtime code MUST
# NOT import the seed package directly (seed records flow through the loader).
# ────────────────────────────────────────────────────────────────────────────────

[[tool.importlinter.contracts]]
name = "simulator_not_imported_by_production"
type = "forbidden"
# Enumerate production source modules sibling-wise so the forbidden
# simulator subtree is NOT itself a descendant of the source set
# (otherwise import-linter aborts with "Modules have shared descendants").
# Only modules with a real ``__init__.py`` are listed (import-linter
# refuses unknown modules).
source_modules = [
  "apps.api.app.auth",
  "apps.api.app.clients",
  "apps.api.app.domain",
  "apps.api.app.models",
  "apps.api.app.observability",
  "apps.api.app.repositories",
  "apps.api.app.schemas",
  "apps.api.app.validators",
  "apps.api.app.services.eval",
  "apps.api.app.services.governance",
  "apps.agents",
]
forbidden_modules = [
  "apps.api.app.services.simulation.feeds",
  "apps.api.app.services.simulation.replay",
  "apps.api.app.services.simulation.generators",
]
# ``ignore_imports`` is intentionally omitted — the feeds/replay/generators
# sub-packages do not yet contain inter-module imports, so an unused-ignore
# entry would itself cause ``lint-imports`` to fail with
# "No matches for ignored import …". Re-add per-edge ignores here only when
# such imports legitimately exist (Phase 5+).

[[tool.importlinter.contracts]]
name = "seed_not_imported_by_runtime"
type = "forbidden"
source_modules = [
  "apps.api",
  "apps.agents",
]
forbidden_modules = [
  "packages.domain.src.domain.seed",
]
# Pre-existing reference-data bootstrap services that intentionally import
# ``packages.domain.src.domain.seed.bootstrap`` for one-shot in-process
# warm-up. These were merged before spec-039 and are NOT regressions to
# fix here; track via plan §"Two-Path Rule — known acceptable callers".
ignore_imports = [
  "apps.api.app.services.governance_registry -> packages.domain.src.domain.seed.bootstrap",
  "apps.api.app.services.organisation_intelligence_service -> packages.domain.src.domain.seed.bootstrap",
  "apps.api.app.services.outcome_evaluator_service -> packages.domain.src.domain.seed.bootstrap",
  "apps.api.app.services.preparedness_analysis_service -> packages.domain.src.domain.seed.bootstrap",
  "apps.api.app.services.seed_service -> packages.domain.src.domain.seed.bootstrap",
]
