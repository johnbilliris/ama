# Pre-commit hooks mirroring CI gates (FR-Q04, T001).
# Run locally: `pre-commit install && pre-commit run --all-files`.
# Hooks pinned to commit SHAs / explicit versions for supply-chain hygiene (FR-C03 spirit).

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.0
          - types-PyYAML
        args: ["--strict", "--ignore-missing-imports"]
        files: "^(apps|packages)/"

  - repo: https://github.com/seddonym/import-linter
    rev: v2.0
    hooks:
      - id: import-linter

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: bicep-lint
        name: bicep-lint
        entry: pwsh -NoProfile -ExecutionPolicy Bypass -Command "Get-ChildItem -Recurse -Filter '*.bicep' infra | ForEach-Object { az bicep build --file $_.FullName --stdout > $null }"
        language: system
        files: "\\.bicep$"
        pass_filenames: false

ci:
  autofix_prs: true
  autoupdate_schedule: monthly
