# Pre-commit hooks mirroring CI gates (FR-Q04, T001).
# Run locally: `pre-commit install && pre-commit run --all-files`.
# Python hook packages are installed through the repository's proxy-only developer installer.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: trailing-whitespace
        name: trailing-whitespace
        entry: trailing-whitespace-fixer
        language: system
      - id: end-of-file-fixer
        name: end-of-file-fixer
        entry: end-of-file-fixer
        language: system
      - id: check-yaml
        name: check-yaml
        entry: check-yaml
        language: system
      - id: check-json
        name: check-json
        entry: check-json
        language: system
      - id: check-toml
        name: check-toml
        entry: check-toml
        language: system
      - id: check-added-large-files
        name: check-added-large-files
        entry: check-added-large-files --maxkb=512
        language: system
      - id: detect-private-key
        name: detect-private-key
        entry: detect-private-key
        language: system
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff-format
        entry: ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: mypy --strict --ignore-missing-imports
        language: system
        files: "^(apps|packages)/"
        types_or: [python, pyi]
      - id: import-linter
        name: import-linter
        entry: lint-imports
        language: system
        pass_filenames: false
      - id: python-package-source-policy
        name: python-package-source-policy
        entry: python scripts/verify_python_package_sources.py
        language: system
        pass_filenames: false
      - id: bicep-lint
        name: bicep-lint
        entry: pwsh -NoProfile -ExecutionPolicy Bypass -Command "Get-ChildItem -Recurse -Filter '*.bicep' infra | ForEach-Object { az bicep build --file $_.FullName --stdout > $null }"
        language: system
        files: "\\.bicep$"
        pass_filenames: false

ci:
  autofix_prs: true
  autoupdate_schedule: monthly
  skip: [trailing-whitespace, end-of-file-fixer, check-yaml, check-json, check-toml, check-added-large-files, detect-private-key, ruff, ruff-format, mypy, import-linter, python-package-source-policy, bicep-lint]
