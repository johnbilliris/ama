[pytest]
testpaths = tests/pipeline tools/pipeline/tests
python_files = test_*.py
python_classes = Test
python_functions = test_*
addopts = -ra --strict-markers --strict-config
markers =
    contract: Contract tests for shared schemas (T017, T021)
    integration: Integration tests with mocked external services (T024a, T029, T033)
    unit: Pure-unit tests for pipeline_tools modules
asyncio_mode = auto
