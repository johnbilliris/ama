[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-tools"
version = "0.1.0"
description = "Spec 029 — Progressive Delivery Pipeline tooling (FR-005, FR-013, FR-014, FR-031, FR-032)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AMA Platform" }]
dependencies = [
  "azure-identity>=1.17",
  "azure-mgmt-resourcegraph>=8.0",
  "azure-storage-blob>=12.20",
  "azure-cosmos>=4.7",
  "azure-monitor-query>=1.3",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "python-frontmatter>=1.1",
  "jsonschema[format]>=4.21",
  "cryptography>=42.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "pytest-httpserver>=1.0",
  "responses>=0.25",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.21",
]

[project.scripts]
posture-verifier = "pipeline_tools.posture_verifier:main"
canary-controller = "pipeline_tools.canary_controller:main"
evidence-packer = "pipeline_tools.evidence_pack_builder:main"
audit-emitter = "pipeline_tools.audit_emitter:main"
freeze-controller = "pipeline_tools.freeze_controller:main"
cross-env-check = "pipeline_tools.cross_env_check:main"
known-good-index = "pipeline_tools.known_good_index:main"
reviewer-sync = "pipeline_tools.reviewer_sync:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pipeline_tools = ["py.typed", "schemas/*.json"]
