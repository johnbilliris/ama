[mypy]
python_version = 3.12
warn_return_any = False
warn_unused_ignores = False
ignore_missing_imports = True
namespace_packages = True
explicit_package_bases = True
mypy_path = src
disallow_untyped_defs = False
check_untyped_defs = True

[mypy-tests.*]
disallow_untyped_defs = False
ignore_errors = True

[mypy-frontmatter]
ignore_missing_imports = True

