[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ama-specify-extension-list"
version = "0.1.0"
description = "Read-only AMA-local extension inventory CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12,<1",
  "rich>=13,<15",
  "pyyaml>=6,<7",
  "requests>=2.32,<3",
  "jsonschema>=4.23,<5",
  "rfc8785>=0.1.4,<1",
  "cryptography>=44,<47",
  "azure-identity>=1.19,<2",
  "azure-storage-blob>=12.24,<13",
  "azure-mgmt-resource>=23.1,<24",
  "azure-mgmt-authorization>=4,<5",
  "azure-keyvault-keys>=4.10,<5",
]

[project.optional-dependencies]
dev = [
  "hatchling>=1.27,<2",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
  "mypy>=1.14,<2",
  "pytest-cov>=6,<8",
  "types-pyyaml>=6.0.12,<7",
  "types-requests>=2.32,<3",
]

[project.scripts]
ama-specify = "specify_cli.cli:app"

[tool.uv]
package = false

[[tool.uv.index]]
name = "microsoft-package-feed-proxy"
url = "https://packagefeedproxy.microsoft.io/pypi/simple"
default = true

[tool.hatch.build]
artifacts = ["src/specify_cli/trusted_attestation_keys.json"]

[tool.hatch.build.targets.wheel]
packages = ["src/specify_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--import-mode=importlib",
  "--strict-config",
  "--strict-markers",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["specify_cli"]
relative_files = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false