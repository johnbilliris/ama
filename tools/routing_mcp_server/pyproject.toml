[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ama-routing-mcp-server"
version = "1.0.0"
description = "Routing service exposed as an MCP server (spec 033, T062, ADR-033-04)"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.27.0",
  "uvicorn>=0.34.0",
  "pydantic>=2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["routing_mcp_server"]
