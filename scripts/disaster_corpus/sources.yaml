# sources.yaml — curated catalogue for the AU disaster-management corpus.
#
# Each entry produces docs/<jurisdiction>/<topic>/<filename>.pdf and a
# matching handbook.md (page-by-page) + images/ folder.
#
# Fields:
#   jurisdiction: national | nsw | vic | qld | sa | wa | tas | nt | act | aidr
#   topic:        kebab-case folder slug (must be unique within jurisdiction)
#   title:        H1 used in the markdown front matter
#   publisher:    publisher name as appearing on the cover
#   url:          stable PDF URL on the publisher's domain (must be in fetch.py allow-list)
#   edition:      "2018", "v2", "2024-25" — appended to title
#   licence:      "CC BY 4.0", "Crown copyright; practitioner use", etc.
#   mode:         full-text | metadata-only | excluded
#                 (default: full-text once licence has been verified)
#   filename:     optional override for the local filename
#   notes:        optional free-text
#
# IMPORTANT: any new host must also be added to DEFAULT_ALLOW_HOSTS in fetch.py.
# This is a deliberate guardrail: a typo in a URL cannot exfiltrate the
# fetcher to an unintended domain.
#
# Default licence stance: Most Australian Government publications are released
# under Creative Commons Attribution 4.0 International (CC BY 4.0). Where the
# publication carries a different licence we record it explicitly. Where the
# publication is Crown copyright "all rights reserved" but the agency has
# made the artifact publicly available for emergency-management practitioners
# to use, we ingest in `metadata-only` mode and downgrade to citation-only.

sources:

