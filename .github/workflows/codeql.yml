name: codeql

# CodeQL steps are commented out because GitHub Code Scanning is not enabled on the
# target repository. The `github/codeql-action/*` actions require Code Scanning to be
# turned on (Settings → Code security and analysis → Code scanning) before they can
# upload SARIF results. Re-enable Code Scanning in repo settings, then uncomment the
# steps below to restore CodeQL analysis.

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: CodeQL unavailable
        run: echo "CodeQL analysis for ${{ matrix.language }} is currently not being checked because this repository does not have a GitHub code scanning license."

