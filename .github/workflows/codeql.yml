name: codeql

on:
  push:
    branches: [main, dev, staging, production]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 06:00 UTC supplementary scan
    - cron: "0 6 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          persist-credentials: false

      - name: CodeQL unavailable
        run: echo "CodeQL analysis for ${{ matrix.language }} is currently not being checked because this repository does not have a GitHub code scanning license."

