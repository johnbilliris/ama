name: spec-035-gate

env:
  PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple
  UV_DEFAULT_INDEX: https://packagefeedproxy.microsoft.io/pypi/simple
  PIP_CONFIG_FILE: /dev/null
  PIP_EXTRA_INDEX_URL: ""
  PIP_FIND_LINKS: ""
  UV_INDEX: ""
  UV_EXTRA_INDEX_URL: ""
  UV_FIND_LINKS: ""
  UV_NO_CONFIG: "1"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariants:
    name: spec-035 invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.0
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5.0.0
        with:
          version: 10.6.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov ruff
          pip install -e apps/api

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: spec-035 spec-hardening invariant
        if: hashFiles('scripts/verify-spec-hardening.ps1') != ''
        shell: pwsh
        run: ./scripts/verify-spec-hardening.ps1

      - name: spec-035 activation-mutex invariant
        if: hashFiles('scripts/verify-activation-mutex.ps1') != ''
        shell: pwsh
        run: ./scripts/verify-activation-mutex.ps1

      - name: spec-035 contract shard
        run: pytest apps/api/tests/contract/spec_035 apps/api/tests/unit/spec_035 -q --tb=short

      - name: domain package typecheck
        run: pnpm --filter @ama/domain run typecheck

      - name: Build TypeScript domain package
        run: pnpm --filter @ama/domain build

      - name: web typecheck (spec-035 surfaces)
        run: pnpm --filter @ama/web exec tsc --noEmit

      - name: extension envelope schema lint
        run: |
          npx --yes ajv-cli@5.0.0 compile --spec=draft2020 -s packages/schemas/spec_035/extension_envelope.schema.json
