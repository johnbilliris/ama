name: eval-publish-dataset

on:
  workflow_dispatch:
    inputs:
      dataset_path:
        description: "Path to the generated dataset directory"
        required: true
        default: "packages/eval-dataset/data/dataset-disaster-core-1.0.0"

permissions:
  contents: read
  # Per spec 031 / FR-009: dropped `id-token: write` — auth now uses
  # AZURE_CREDENTIALS (creds: JSON), not OIDC. Re-add only if the operator
  # activates the commented Azure-publish block AND chooses an OIDC path.

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    env:
      DATASET_PATH: ${{ github.event.inputs.dataset_path || 'packages/eval-dataset/data/dataset-disaster-core-1.0.0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v5.0.0 (raised from v4)

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.0 (raised from v5)
        with:
          python-version: "3.12"

      - name: Install eval-core + eval-dataset
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/eval-core --no-deps
          python -m pip install -e packages/eval-dataset --no-deps
          python -m pip install pydantic>=2.10.0 pytest ruff

      - name: Lint (ruff)
        run: python -m ruff check packages/eval-dataset/

      - name: Unit tests
        run: python -m pytest packages/eval-dataset/tests/ -q

      - name: Validate committed corpus
        run: |
          python -m ama_eval_dataset validate \
            --input "${DATASET_PATH}/cases.jsonl"

      - name: Verify manifest contentHash matches cases.jsonl
        run: |
          python - <<'PY'
          import json, hashlib, os, sys
          from pathlib import Path
          from ama_eval_core.models import EvaluationCase
          base = Path(os.environ["DATASET_PATH"])
          cases = [
              EvaluationCase.model_validate_json(line)
              for line in (base / "cases.jsonl").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          canonical = json.dumps(
              [json.loads(c.model_dump_json()) for c in cases],
              sort_keys=True,
              separators=(",", ":"),
          ).encode()
          digest = "sha256:" + hashlib.sha256(canonical).hexdigest()
          manifest = json.loads((base / "manifest.json").read_text(encoding="utf-8"))
          if manifest["contentHash"] != digest:
              print(f"hash mismatch: manifest={manifest['contentHash']} computed={digest}", file=sys.stderr)
              sys.exit(1)
          print(f"OK: contentHash {digest} matches over {len(cases)} cases")
          PY

      - name: Upload cases + manifest as artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (raised from v4)
        with:
          name: dataset-${{ github.sha }}
          path: |
            ${{ env.DATASET_PATH }}/cases.jsonl
            ${{ env.DATASET_PATH }}/manifest.json
          retention-days: 30

      # ---------------------------------------------------------------------
      # Azure Storage publish (operator must activate by uncommenting).
      # Per spec 031 / FR-019b: when activated, this block authenticates via
      # AZURE_CREDENTIALS sourced from a GitHub Environment. The operator
      # must also add `environment: dev` (or staging/production) at the job
      # level so the secret resolves correctly. Recommended: `dev` for
      # dataset-development workflow runs.
      # ---------------------------------------------------------------------
      # - name: Azure login
      #   uses: azure/login@2dd0bbf4064d5a1812889dc200bb8eed2597f82a # v3.x
      #   with:
      #     creds: ${{ secrets.AZURE_CREDENTIALS }}
      #
      # - name: Upload to immutable blob (FR-013)
      #   run: |
      #     az storage blob upload-batch \
      #       --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
      #       --destination ${{ secrets.AZURE_DATASET_CONTAINER }} \
      #       --destination-path datasets/disaster-response-core/1.0.0/ \
      #       --source ${{ env.DATASET_PATH }} \
      #       --auth-mode login \
      #       --overwrite false
      #
      # - name: Publish dataset version via API
      #   run: |
      #     curl -sS -X POST \
      #       "${{ secrets.AMA_API_BASE }}/api/eval/datasets/disaster-response-core/versions" \
      #       -H "Authorization: Bearer ${{ steps.azlogin.outputs.token }}" \
      #       -H "Content-Type: application/json" \
      #       --data @${{ env.DATASET_PATH }}/manifest.json
