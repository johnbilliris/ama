name: spec-038 — help snapshot publish

on:
  push:
    branches: [main]
    paths:
      - "apps/web/src/content/help/**"
      - "apps/ingest-runner/manifests/help-snapshot.yaml"
  workflow_dispatch:
    inputs:
      mode:
        description: "publish or rollback"
        required: true
        default: publish
      snapshot_id:
        description: "snapshot id for rollback"
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ github.event.inputs.mode != 'rollback' }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml pydantic
      - name: Build time gates
        run: |
          python tools/help/lint_lang_attributes.py
          python tools/help/link_checker.py
      - name: Publish snapshot
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          python tools/help/publish_snapshot.py publish \
            --manifest apps/ingest-runner/manifests/help-snapshot.yaml \
            --approver "${{ github.event.pull_request.user.login }}=help_content_owner" \
            --approver "${{ secrets.SAFETY_LEAD_IDENTITY }}=safety_lead"

  rollback:
    if: ${{ github.event.inputs.mode == 'rollback' }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml pydantic
      - run: python tools/help/publish_snapshot.py rollback --restored-snapshot-id ${{ github.event.inputs.snapshot_id }}
