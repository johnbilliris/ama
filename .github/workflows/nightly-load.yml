name: nightly-load

env:
  PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple
  UV_DEFAULT_INDEX: https://packagefeedproxy.microsoft.io/pypi/simple
  PIP_CONFIG_FILE: /dev/null
  PIP_EXTRA_INDEX_URL: ""
  PIP_FIND_LINKS: ""
  UV_INDEX: ""
  UV_EXTRA_INDEX_URL: ""
  UV_FIND_LINKS: ""
  UV_NO_CONFIG: "1"

# Spec-032 FR-T05 / FR-R02 — runs tests/load/ nightly against staging.
# Posts results to App Insights customMetrics so the LLM-Cost / Agent-Flow
# workbooks can render trend lines.

on:
  schedule:
    # Daily at 16:00 UTC = 02:00–03:00 AEST (low traffic window)
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Environment to load-test (default: staging)"
        required: false
        default: staging

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event.inputs.target_environment || 'staging' }}
    env:
      TARGET_ENV: ${{ github.event.inputs.target_environment || 'staging' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.0
        with:
          python-version: "3.12"

      - name: Install load-test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-benchmark locust httpx pyyaml
          pip install -e apps/api -e apps/agents

      - name: Run load smoke pytest tier
        run: |
          mkdir -p load-results
          if [ -z "${{ vars.LOAD_TARGET_URL }}" ]; then
            echo "::error::LOAD_TARGET_URL is required and must reference the staging host."
            exit 1
          fi
          locust --headless \
            --host "${{ vars.LOAD_TARGET_URL }}" \
            --users 1000 \
            --spawn-rate 50 \
            --run-time 10m \
            -f tests/load/locustfile.py \
            DashboardUser BurstIngestionUser \
            --csv load-results/locust
          python tests/load/report.py \
            --stats-csv load-results/locust_stats.csv \
            --environment "$TARGET_ENV" \
            --revision "${GITHUB_SHA}" \
            --concurrent-users 1000 \
            --output-json load-results/report.json
          cat > load-results/run-metadata.json <<EOF
          {
            "environment": "${TARGET_ENV}",
            "revision": "${GITHUB_SHA}",
            "host": "${{ vars.LOAD_TARGET_URL }}",
            "users": 1000,
            "spawn_rate": 50,
            "run_time": "10m"
          }
          EOF
        env:
          AMA_LOAD_TARGET: ${{ vars.LOAD_TARGET_URL }}
          AMA_LOAD_INCIDENT_ID: ${{ vars.LOAD_INCIDENT_ID || 'inc-1' }}
          AMA_LOAD_AUTH_HEADER_NAME: ${{ vars.LOAD_AUTH_HEADER_NAME || '' }}
          AMA_LOAD_AUTH_HEADER_VALUE: ${{ secrets.LOAD_AUTH_HEADER_VALUE || '' }}

      - name: Publish results to App Insights
        if: success()
        env:
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
        shell: bash
        run: |
          if [ -z "${APPLICATIONINSIGHTS_CONNECTION_STRING:-}" ]; then
            echo "::warning::APPLICATIONINSIGHTS_CONNECTION_STRING not set; skipping telemetry post."
            exit 0
          fi
          # Post a single 'loadtest.run_total' counter event so the workbook can
          # show nightly ticks; full load metrics post via the test runner itself.
          python - <<'EOF'
          import os
          try:
              from azure.monitor.opentelemetry import configure_azure_monitor
              from opentelemetry import metrics
              configure_azure_monitor(connection_string=os.environ["APPLICATIONINSIGHTS_CONNECTION_STRING"])
              meter = metrics.get_meter("ama.loadtest")
              counter = meter.create_counter("loadtest.run_total")
              counter.add(1, {"environment": os.environ.get("TARGET_ENV", "staging"), "outcome": "completed"})
              from opentelemetry.sdk.metrics import MeterProvider
              if isinstance(metrics.get_meter_provider(), MeterProvider):
                  metrics.get_meter_provider().force_flush()
          except Exception as exc:
              print(f"telemetry post failed (non-fatal): {exc}")
          EOF

      - name: Upload load test artefacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: load-results
          path: load-results/
          retention-days: 30

      - name: Open issue on regression
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.x
        with:
          script: |
            const env = process.env.TARGET_ENV;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly load test failed (${env}) — ${new Date().toISOString().slice(0,10)}`,
              body: `The nightly load test against \`${env}\` failed. See workflow run: ${context.payload.repository.html_url}/actions/runs/${context.runId}`,
              labels: ["incident", "load-test", "spec-032"]
            });
