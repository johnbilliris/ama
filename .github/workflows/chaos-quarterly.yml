name: chaos-quarterly

# Spec-032 FR-R05 / FR-T03 — quarterly Azure Chaos Studio gameday.
# Staging only. Runs the 'ama-quarterly-gameday' experiment provisioned by
# infra/modules/chaos-studio.bicep, then posts results to App Insights.

on:
  schedule:
    # First Sunday of every quarter (Mar/Jun/Sep/Dec) at 23:00 UTC
    - cron: "0 23 1-7 3,6,9,12 0"
  workflow_dispatch:
    inputs:
      experiment_name:
        description: "Chaos experiment name"
        required: false
        default: ama-quarterly-gameday

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  gameday:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Start chaos experiment
        id: start
        shell: pwsh
        env:
          EXP: ${{ github.event.inputs.experiment_name || 'ama-quarterly-gameday' }}
          RG: ${{ vars.AZURE_RG_STAGING || 'rg-drh-staging' }}
        run: |
          $start = az rest --method post `
            --uri "https://management.azure.com/subscriptions/$env:AZURE_SUBSCRIPTION_ID/resourceGroups/$env:RG/providers/Microsoft.Chaos/experiments/$env:EXP/start?api-version=2024-01-01"
          Write-Host $start
          # Capture experiment execution id for status polling
          $exec = ($start | ConvertFrom-Json).statusUrl
          "exec=$exec" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Wait for experiment to complete
        if: steps.start.outputs.exec
        shell: pwsh
        run: |
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 30
            $status = az rest --method get --uri "${{ steps.start.outputs.exec }}" | ConvertFrom-Json
            Write-Host ("Status: {0}" -f $status.properties.status)
            if ($status.properties.status -in @('Success','Failed','Cancelled')) { break }
          }

      - name: Open issue summarising the gameday
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const date = new Date().toISOString().slice(0,10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Chaos gameday ${date} — staging`,
              body: [
                "Spec-032 FR-R05 quarterly Azure Chaos Studio gameday completed.",
                "",
                "Workflow run: " + context.payload.repository.html_url + "/actions/runs/" + context.runId,
                "",
                "Please attach:",
                "- SLO-impact summary (App Insights workbook screenshots)",
                "- Findings + remediation notes"
              ].join("\n"),
              labels: ["chaos", "spec-032", "exercise"]
            });
