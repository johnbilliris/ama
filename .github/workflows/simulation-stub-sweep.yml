name: simulation-stub-sweep

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/agents/**"
      - "tools/simulation_stub_sweep.py"
      - ".github/workflows/simulation-stub-sweep.yml"
  push:
    branches: [main]

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Spec-036 / T-J10 — BLOCKING. Once T-B14 deletes the legacy
      # stub adapters, this job is a hard required-status-check via
      # `.github/branch-protection.yml`. Any PR that re-introduces the
      # trip-wire literal will fail the sweep.
      - name: simulation-stub-sweep (blocking)
        run: python tools/simulation_stub_sweep.py --root . --enforce
