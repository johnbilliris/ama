name: prompts-publish

# Spec-032 FR-AI09 + T606 — sign every prompt artefact with cosign keyless
# (Sigstore Fulcio identity = GitHub Actions OIDC token).
# cd.yml verifies before deploy (T607).

on:
  workflow_dispatch:

permissions:
  id-token: write   # cosign keyless requires OIDC token
  contents: write   # to commit signatures back

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.x
        with:
          cosign-release: v2.4.1

      - name: Sign prompt artefacts
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only HEAD~1 HEAD -- 'packages/prompts/*.yaml' 'packages/prompts/**/*.yaml' || true)
          if [ -z "$changed" ]; then
            echo "No prompt YAML changes to sign."
            exit 0
          fi
          for f in $changed; do
            if [ -f "$f" ]; then
              echo "Signing $f"
              cosign sign-blob --yes \
                --output-signature "${f}.sig" \
                --output-certificate "${f}.crt" \
                "$f"
            fi
          done

      - name: Commit signatures
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        with:
          commit_message: "chore(prompts): cosign signatures (FR-AI09)"
          file_pattern: "packages/prompts/**/*.{sig,crt}"
