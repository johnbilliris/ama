# .github/workflows/cd.yml — Continuous Deployment pipeline (spec 031)
#
# Branch-based deployment model (1:1 branch → environment):
#   push to dev        → CI runs → CD deploys to rg-drh-dev
#   push to staging    → CI runs → CD deploys to rg-drh-staging
#   push to production → CI runs → CD deploys to rg-drh-production
#   push to main       → CI runs (no CD)
#   PR to main         → CI runs (no deploy)
#
# Auth: single AZURE_CREDENTIALS JSON secret per GitHub Environment
#       (see ADR-031, contracts/azure-credentials.schema.json).
#
# Rollback: staging/prod only; dev fails loudly without rollback (FR-015b).
#
# See: specs/031-simplify-cicd-pipeline/contracts/cd-workflow.md

name: cd

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches:
      - dev
      - staging
      - production

permissions:
  contents: read       # checkout the head_sha that ci validated
  issues: write        # create issues for critical staging/prod failures
  actions: read        # read upstream workflow_run metadata

jobs:
  deploy:
    name: Deploy to ${{ github.event.workflow_run.head_branch }}
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    environment: ${{ github.event.workflow_run.head_branch }}
    # Initial dev provision of the full DRH stack (Container Apps environment +
    # api/agents/ingestion containers + Cosmos + Storage + OpenAI + App Service
    # + monitoring) takes 25-35 minutes. 60 leaves headroom; subsequent
    # provisions on existing resources are faster (~5-10 min).
    timeout-minutes: 60
    concurrency:
      # Branch ↔ environment is 1:1, so grouping by head_branch is equivalent
      # to grouping by target environment and prevents concurrent deploys to
      # the same environment.
      group: deploy-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false

    outputs:
      deployment-status: ${{ steps.set-status.outputs.status }}
      revision-api: ${{ steps.record-revisions.outputs.revision-api }}
      revision-agents: ${{ steps.record-revisions.outputs.revision-agents }}
      revision-ingest: ${{ steps.record-revisions.outputs.revision-ingest }}
      revision-web: ${{ steps.record-revisions.outputs.revision-web }}

    steps:
      # Step 1 — checkout the EXACT commit ci validated, not the default branch.
      # workflow_run runs default-branch context unless ref is set explicitly.
      - name: Checkout validated commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Step 2 — pin TARGET_ENV from the source branch for downstream steps.
      # Branch ↔ environment is 1:1: dev/staging/production map to their
      # respective environments. `main` is excluded by the trigger filter
      # above, so head_branch is always one of these three here.
      - name: Resolve target environment
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          TARGET_ENV="${HEAD_BRANCH}"
          echo "TARGET_ENV=${TARGET_ENV}" >> "$GITHUB_ENV"
          echo "AZURE_ENV_NAME=drh-${TARGET_ENV}" >> "$GITHUB_ENV"
          echo "RESOURCE_GROUP=rg-drh-${TARGET_ENV}" >> "$GITHUB_ENV"

      # Step 3 — explicit fail-fast on missing AZURE_CREDENTIALS (FR-016).
      # azure/login also fails on this, but its message does not name the
      # environment; this guard makes the error operator-actionable.
      - name: Validate AZURE_CREDENTIALS present
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [[ -z "${AZURE_CREDENTIALS}" ]]; then
            echo "::error::AZURE_CREDENTIALS secret is missing for environment '${TARGET_ENV}'. Set it via: gh secret set AZURE_CREDENTIALS --env ${TARGET_ENV} --body \"\$(cat azure-credentials-${TARGET_ENV}.json)\""
            exit 1
          fi

      # Step 4 — single auth path: AZURE_CREDENTIALS JSON (ADR-031).
      - name: Azure Login
        uses: azure/login@2dd0bbf4064d5a1812889dc200bb8eed2597f82a # v3.x
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@003306647c7696088e6dff0900435682cb5e6ebd # v2.x

      # Install the toolchain that azd's pre-provision/post-deploy hooks
      # need to build artefacts (apps/web requires pnpm; apps/api & agents
      # require Python). Order matches ci.yml: pnpm BEFORE setup-node so
      # node's package-manager-cache feature finds pnpm on PATH.
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5.0.0
        with:
          version: 10.6.3

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.0
        with:
          python-version: "3.12"

      - name: Install seed loader dependencies
        run: python -m pip install -e apps/api

      # azd has its own auth flow, separate from azure/login. Authenticate
      # with the same service principal so `azd provision`/`azd deploy`
      # inherit the right context.
      - name: azd auth login (service principal)
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          CLIENT_ID=$(echo "${AZURE_CREDENTIALS}" | jq -r .clientId)
          CLIENT_SECRET=$(echo "${AZURE_CREDENTIALS}" | jq -r .clientSecret)
          TENANT_ID=$(echo "${AZURE_CREDENTIALS}" | jq -r .tenantId)
          azd auth login \
            --client-id "${CLIENT_ID}" \
            --client-secret "${CLIENT_SECRET}" \
            --tenant-id "${TENANT_ID}"

      - name: Create resource group
        run: |
          az group create \
            --name "${RESOURCE_GROUP}" \
            --location australiaeast \
            --output none

      - name: Configure azd environment
        run: |
          azd env new "${AZURE_ENV_NAME}" --no-prompt || true
          azd env set AZURE_ENV_NAME "${AZURE_ENV_NAME}"
          azd env set AZURE_LOCATION australiaeast
          # 2dd0bbf4064d5a1812889dc200bb8eed2597f82a # v3.x with creds: exposes subscription via az context;
          # surface it explicitly for azd.
          SUB=$(az account show --query id -o tsv)
          azd env set AZURE_SUBSCRIPTION_ID "${SUB}"

          global_admin_ids='[]'
          graph_error="$(mktemp)"
          if role_response=$(az rest --method GET --url "https://graph.microsoft.com/v1.0/directoryRoles?\$filter=displayName%20eq%20'Global%20Administrator'" 2>"${graph_error}"); then
            role_id=$(echo "${role_response}" | jq -r '.value[0].id // empty')
            if [[ -z "${role_id}" ]]; then
              echo "::warning::Could not resolve the Microsoft Entra Global Administrator directory role; skipping automatic Cosmos DB reader RBAC for Global Administrator users."
            else
              members_url="https://graph.microsoft.com/v1.0/directoryRoles/${role_id}/members?\$select=id,userPrincipalName"
              while [[ -n "${members_url}" ]]; do
                if ! members_response=$(az rest --method GET --url "${members_url}" 2>"${graph_error}"); then
                  echo "::warning::Could not enumerate Global Administrator members via Microsoft Graph; skipping automatic Cosmos DB reader RBAC for Global Administrator users. Grant the deployment identity Microsoft Graph directory role read permissions to enable this."
                  global_admin_ids='[]'
                  break
                fi
                page_ids=$(echo "${members_response}" | jq -c '[.value[] | select(."@odata.type" == "#microsoft.graph.user") | .id]')
                global_admin_ids=$(jq -cn --argjson existing "${global_admin_ids}" --argjson page "${page_ids}" '$existing + $page | unique')
                members_url=$(echo "${members_response}" | jq -r '."@odata.nextLink" // empty')
              done
            fi
          else
            echo "::warning::Could not read Microsoft Entra directory roles via Microsoft Graph; skipping automatic Cosmos DB reader RBAC for Global Administrator users. Grant the deployment identity Microsoft Graph directory role read permissions to enable this."
          fi
          rm -f "${graph_error}"

          echo "Resolved $(echo "${global_admin_ids}" | jq 'length') Global Administrator user account(s) for Cosmos DB data-plane reader access."
          azd env set globalAdministratorPrincipalIds "$(echo "${global_admin_ids}" | jq -c '.')"

      # Self-heal soft-deleted Cognitive Services accounts in the target
      # resource group before provisioning. Bicep generates account names
      # deterministically from `uniqueString(rg.id)` (infra/main.bicep,
      # infra/modules/content-safety.bicep), so a soft-deleted predecessor
      # from a prior destroyed deploy collides on the next `azd provision`
      # with `FlagMustBeSetForRestore`. Scope: any Cognitive Services kind
      # (OpenAI, ContentSafety, …) located in this deployment RG. Purge is
      # idempotent and a no-op when nothing matches; restricting to the
      # deployment RG keeps it from touching unrelated soft-deleted accounts
      # elsewhere in the subscription.
      - name: Purge soft-deleted Cognitive Services accounts (self-heal)
        run: |
          set -euo pipefail
          deleted=$(az cognitiveservices account list-deleted \
            --query "[?contains(id, '/resourceGroups/${RESOURCE_GROUP}/')].{name:name, location:location, kind:kind}" \
            -o json)
          count=$(echo "${deleted}" | jq 'length')
          echo "Soft-deleted Cognitive Services accounts in ${RESOURCE_GROUP}: ${count}"
          if [[ "${count}" -gt 0 ]]; then
            echo "${deleted}" | jq -c '.[]' | while read -r row; do
              name=$(echo "${row}" | jq -r .name)
              loc=$(echo "${row}" | jq -r .location)
              kind=$(echo "${row}" | jq -r .kind)
              echo "Purging ${kind} account ${name} in ${loc}..."
              az cognitiveservices account purge \
                --name "${name}" \
                --location "${loc}" \
                --resource-group "${RESOURCE_GROUP}"
            done
          fi

      - name: Verify Foundry carve-out registry (spec 036, FR-RAG-CV-01..04)
        # Spec 036 T026 — block deploy if any Foundry deployment lacks
        # carve-out approval, has placeholder approvers, an expired or out-of-window
        # review_date, or sits outside Australian data-residency. Pre-plan-apply
        # gate runs **before** ``azd provision`` so CD never reaches Bicep with a
        # non-conformant registry.
        run: |
          if ! command -v pwsh >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends powershell
          fi
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify-carveout.ps1 \
            -RegistryPath infra/parameters/foundry-carveout.yaml -Strict

      - name: Provision infrastructure
        run: azd provision --no-prompt

      - name: Deploy services
        run: azd deploy --no-prompt

      - name: Health checks (api + web)
        id: health-check
        run: |
          set +e
          TIMEOUT=30
          RETRIES=5
          INTERVAL=15
          FAILED=0

          # Discover the deployed resource names dynamically. azd applies a
          # deterministic prefix (`ca-` / `app-`) plus the env name and (for
          # the App Service) a random unique suffix. Internal-only services
          # (`agents`, `ingest`) have no public ingress and are validated
          # transitively via api health.
          API_NAME="ca-api-${AZURE_ENV_NAME}"
          API_FQDN=$(az containerapp show \
            --name "${API_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null)

          WEB_FQDN=$(az webapp list \
            --resource-group "${RESOURCE_GROUP}" \
            --query "[?starts_with(name, 'app-${AZURE_ENV_NAME}')].defaultHostName | [0]" -o tsv 2>/dev/null)

          echo "Resolved API FQDN: ${API_FQDN:-<not found>}"
          echo "Resolved Web FQDN: ${WEB_FQDN:-<not found>}"

          check_health() {
            local label="$1" url="$2"
            if [[ -z "${url}" || "${url}" == "https://" ]]; then
              echo "::error::Could not resolve URL for ${label}"
              return 1
            fi
            for attempt in $(seq 1 "${RETRIES}"); do
              local code
              code=$(curl -sk -o /dev/null -w "%{http_code}" --max-time "${TIMEOUT}" "${url}" 2>/dev/null || echo "000")
              if [[ "${code}" =~ ^[23][0-9]{2}$ ]]; then
                echo "✅ ${label}: HEALTHY (HTTP ${code}) at ${url}"
                return 0
              fi
              echo "⏳ ${label}: attempt ${attempt}/${RETRIES} — HTTP ${code} at ${url}"
              [[ ${attempt} -lt ${RETRIES} ]] && sleep "${INTERVAL}"
            done
            echo "::error::Health check failed for ${label} in ${TARGET_ENV} (${url})"
            return 1
          }

          check_health "api" "https://${API_FQDN}/api/health" &
          PID_API=$!
          check_health "web" "https://${WEB_FQDN}/" &
          PID_WEB=$!

          wait $PID_API || FAILED=$((FAILED + 1))
          wait $PID_WEB || FAILED=$((FAILED + 1))

          if [[ $FAILED -gt 0 ]]; then
            echo "health-passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "health-passed=true" >> "$GITHUB_OUTPUT"

      - name: Record known-good revisions
        id: record-revisions
        if: success()
        run: |
          # Container apps revision (api only — agents/ingest are internal,
          # rollback for them is via image-tag pin in main.bicep, not this step)
          api_rev=$(az containerapp show \
            --name "ca-api-${AZURE_ENV_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query "properties.latestRevisionName" -o tsv 2>/dev/null || echo "")
          echo "revision-api=${api_rev}" >> "$GITHUB_OUTPUT"
          echo "📌 api revision: ${api_rev}"

          for svc in agents ingest; do
            rev=$(az containerapp show \
              --name "ca-${svc}-${AZURE_ENV_NAME}" \
              --resource-group "${RESOURCE_GROUP}" \
              --query "properties.latestRevisionName" -o tsv 2>/dev/null || echo "")
            echo "revision-${svc}=${rev}" >> "$GITHUB_OUTPUT"
            echo "📌 ${svc} revision: ${rev}"
          done

          web_id=$(az webapp list \
            --resource-group "${RESOURCE_GROUP}" \
            --query "[?starts_with(name, 'app-${AZURE_ENV_NAME}')].id | [0]" -o tsv 2>/dev/null || echo "")
          echo "revision-web=${web_id}" >> "$GITHUB_OUTPUT"
          echo "📌 web deployment: ${web_id}"

          # Spec-034 FR-027 — emit a JSON blob the next step consumes.
          revisions_json=$(jq -nc \
            --arg api "${api_rev}" \
            --arg agents "$(echo '${{ steps.record-revisions.outputs.revision-agents }}' || true)" \
            --arg ingest "$(echo '${{ steps.record-revisions.outputs.revision-ingest }}' || true)" \
            --arg web "${web_id}" \
            '{api: $api, web: $web}')
          echo "json=${revisions_json}" >> "$GITHUB_OUTPUT"

      # Spec-034 FR-027 — refresh the known-good rollback manifest after a
      # successful deploy, so a future regression can be auto-rolled back to
      # this commit's combination of (api revision, web deployment id, trace).
      - name: Update FR-027 known-good manifest
        id: update-known-good
        if: success() && env.TARGET_ENV != 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip >/dev/null
          python -m pip install jsonschema >/dev/null
          python scripts/web-coverage/known-good.py update \
            --commit "${{ github.sha }}" \
            --revisions-json '${{ steps.record-revisions.outputs.json }}' \
            --trace specs/034-webapp-capstone-coverage/coverage-trace.json
          if ! git diff --quiet specs/034-webapp-capstone-coverage/known-good.json; then
            git config user.name  "ama-bot"
            git config user.email "ama-bot@users.noreply.github.com"
            git add specs/034-webapp-capstone-coverage/known-good.json
            git commit -m "chore(034): refresh known-good manifest at ${{ github.sha }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || echo "::warning::known-good push skipped (likely tag/PR ref)"
          else
            echo "::notice::known-good manifest unchanged"
          fi

      # FR-015a: rollback runs only for staging and production (never for dev).
      - name: Rollback on health failure (staging/prod only)
        id: rollback
        if: failure() && steps.health-check.outcome == 'failure' && env.TARGET_ENV != 'dev'
        run: |
          chmod +x scripts/rollback.sh
          scripts/rollback.sh \
            --environment "${TARGET_ENV}" \
            --resource-group "${RESOURCE_GROUP}"
          echo "rollback-result=success" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      # FR-015a: critical-failure issue created only when staging/prod rollback fails.
      - name: Create critical failure issue (staging/prod only)
        if: failure() && steps.rollback.outcome == 'failure' && env.TARGET_ENV != 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "CRITICAL: Rollback failed in ${TARGET_ENV}" \
            --body "## 🚨 Critical Deployment Failure

          **Environment**: ${TARGET_ENV}
          **Resource Group**: ${RESOURCE_GROUP}
          **Workflow Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Trigger**: CI run #${{ github.event.workflow_run.id }}

          ### What happened
          1. Deployment to ${TARGET_ENV} completed
          2. Health checks **failed**
          3. Automated rollback was triggered
          4. Rollback also **failed** — manual intervention required

          ### Required Actions
          1. Check the [workflow run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          2. Manually verify service health in Azure Portal
          3. If needed, manually roll back using: \`scripts/rollback.sh --environment ${TARGET_ENV} --resource-group ${RESOURCE_GROUP}\`
          4. Investigate root cause before re-deploying
          " \
            --label "critical"

      - name: Set deployment status
        id: set-status
        if: always()
        run: |
          if [[ "${{ steps.health-check.outcome }}" == "success" ]]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          elif [[ "${TARGET_ENV}" == "dev" ]]; then
            echo "status=failed-no-rollback" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.rollback.outcome }}" == "success" ]]; then
            echo "status=rolled-back" >> "$GITHUB_OUTPUT"
          else
            echo "status=critical-failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Deployment summary
        if: always()
        run: |
          STATUS="${{ steps.set-status.outputs.status }}"
          echo "## Deployment to ${TARGET_ENV}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Resource Group**: ${RESOURCE_GROUP}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **azd env name**: ${AZURE_ENV_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Source commit**: ${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Triggered by CI run**: ${{ github.event.workflow_run.id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          case "${STATUS}" in
            success)
              echo "✅ **Status**: Deployed successfully" >> "$GITHUB_STEP_SUMMARY"
              ;;
            rolled-back)
              echo "⚠️ **Status**: Rolled back (health check failure in ${TARGET_ENV})" >> "$GITHUB_STEP_SUMMARY"
              ;;
            critical-failure)
              echo "🚨 **Status**: CRITICAL FAILURE in ${TARGET_ENV} — manual intervention required" >> "$GITHUB_STEP_SUMMARY"
              ;;
            failed-no-rollback)
              echo "❌ **Status**: Deploy failed in ${TARGET_ENV}; no rollback (dev environment, FR-015b). Push a fix commit." >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
