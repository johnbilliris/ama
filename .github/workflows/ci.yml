  story-acceptance:
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NPM_CONFIG_REGISTRY: https://packagefeedproxy.microsoft.io/npm/
      PYTHONPATH: ${{ github.workspace }}/packages/domain/src
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5.0.0
        with:
          version: 10.6.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.0
        with:
          python-version: "3.12"
      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Install API package
        run: |
          python -m pip install -e apps/api
          python -m pip install -e apps/agents
      - name: Configure reliable Ubuntu APT mirror
        run: |
          set -euo pipefail
          if sudo grep -Rqs -- 'azure.archive.ubuntu.com' /etc/apt/sources.list.d; then
            sudo grep -RIlZ -- 'azure.archive.ubuntu.com' /etc/apt/sources.list.d \
              | sudo xargs -0r sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g'
            echo "::notice::Using archive.ubuntu.com instead of the Azure APT mirror."
          else
            echo "::notice::No Azure APT mirror entries found; keeping the runner's configured mirror."
          fi
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
      - name: Install Playwright Chromium
        run: pnpm --filter @ama/web exec playwright install --with-deps chromium
      - name: Assert Spec 040 evidence tests are collected
        run: |
          set -euo pipefail
          LIST_OUTPUT="$(pnpm --filter @ama/web exec playwright test --list --project=evidence)"
          echo "$LIST_OUTPUT"
          COUNT="$(printf '%s\n' "$LIST_OUTPUT" | grep -c 'evidence.spec.ts:' || true)"
          test "$COUNT" -ge 5
      - name: Run Spec 040 evidence workflows
        env:
          AMA_TEST_MODE: "1"
          AMA_TEST_SUPPORT: "1"
          AMA_ENVIRONMENT: "dev"
        run: pnpm --filter @ama/web exec playwright test --project=evidence
      - name: Assert story acceptance tests are collected
        run: |
          set -euo pipefail
          LIST_OUTPUT="$(pnpm --filter @ama/web exec playwright test --list --project=chromium --project=mobile \
            test_incident_commander_dashboard.spec.ts \
            test_persona_workspace.spec.ts \
            test_dashboard_decision_support.spec.ts)"
          echo "$LIST_OUTPUT"
          COLLECTED_COUNT="$(printf '%s\n' "$LIST_OUTPUT" | grep -E 'test_incident_commander_dashboard|test_persona_workspace|test_dashboard_decision_support' | wc -l)"
          if [ "${COLLECTED_COUNT}" -eq 0 ]; then
            echo "No acceptance tests collected for chromium/mobile projects."
            exit 1
          fi
      - name: Run story acceptance tests (chromium + mobile)
        env:
          AMA_TEST_SUPPORT: "1"
          AMA_ENVIRONMENT: "dev"
        run: |
          pnpm --filter @ama/web exec playwright test \
            --project=chromium \
            --project=mobile \
            test_incident_commander_dashboard.spec.ts \
            test_persona_workspace.spec.ts \
            test_dashboard_decision_support.spec.ts

  evidence-pack-publication-gate:
    # Spec-037 (T046, RES-04, FR-008, FR-009, FR-037, FR-038, SC-002, SC-011)
    # Single fail-fast job that runs schema -> link -> ratio -> signoff checks
    # over every evidence-pack JSON sidecar. Honours
    # .github/instructions/governance-discovery.instructions.md (T050 lists
    # this gate by job name in the discovery index).
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gate dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "jsonschema>=4.21" pyyaml referencing
      - name: Run evidence-pack publication gate
        env:
          PYTHONPATH: scripts
        run: |
          python -m evidence_pack_gate
      - name: Emit App Insights gate metrics (placeholder)
        # T048 + Step 8 review finding tech-HIGH-2 (sre-engineer):
        # gate logic above DOES execute and the gate itself emits OpenTelemetry
        # counters from the application code (see manual_row_ratio.py and
        # evidence_pack_writer.py). The CI-job-level export to App Insights is
        # the only deferred piece, pending AMA_GATE_AI_CONNECTION_STRING secret
        # lands in branch-protected scope (orchestrator-authorised deferral to
        # Step 9 azd-up redeploy; see spec.md § "Step 8 Cohort Review Amendment Log").
        if: always()
        run: echo "::notice title=evidence-pack-publication-gate::completed (telemetry export deferred to Step 9 per spec.md amendment log R2)"

  # ---------------------------------------------------------------------------
  # Spec 001 / FR-021, FR-022, FR-023 — Architecture documentation validation.
  # Runs in parallel with the quality job (no needs: dependency).
  # No path filter: spec cross-reference correctness is checked on every PR.
  # ---------------------------------------------------------------------------
  docs-arch:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_REGISTRY: https://packagefeedproxy.microsoft.io/npm/
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.0
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          # docs-arch only uses `npx markdownlint-cli2`; no `pnpm install`
          # runs so the auto package-manager cache has no directory to save.
          package-manager-cache: false

      - name: Install lychee (link checker)
        run: |
          LYCHEE_VERSION=v0.15.1
          curl -fsSL "https://github.com/lycheeverse/lychee/releases/download/${LYCHEE_VERSION}/lychee-${LYCHEE_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /tmp
          sudo install /tmp/lychee /usr/local/bin/lychee
          lychee --version

      # FR-022: Markdown lint
      - name: markdownlint
        run: npx --yes markdownlint-cli2 "docs/architecture/**/*.md"

      # FR-021b: Internal link check (scoped to docs/architecture/)
      - name: link-check
        run: |
          lychee \
            --offline \
            --include-fragments \
            --base docs/architecture \
            --max-retries 2 \
            --timeout 30 \
            --no-progress \
            "docs/architecture/**/*.md"

      # FR-021a: PNG ↔ .drawio pairing
      - name: png-drawio-pairing
        run: |
          FAIL=0

          # Every .png must have a sibling .drawio
          while IFS= read -r png; do
            base="${png%.png}"
            if [ ! -f "${base}.drawio" ]; then
              echo "FAIL: PNG without .drawio sibling: $png"
              FAIL=1
            fi
          done < <(find docs/architecture -name '*.png')

          # Every .drawio must have a sibling .png
          while IFS= read -r drawio; do
            base="${drawio%.drawio}"
            if [ ! -f "${base}.png" ]; then
              echo "FAIL: .drawio without .png sibling: $drawio"
              FAIL=1
            fi
          done < <(find docs/architecture -name '*.drawio')

          [ "$FAIL" -eq 0 ] || exit 1
          echo "PNG ↔ .drawio pairing: OK"

      # FR-021d: SHA256 hash manifest check
      - name: hash-manifest-check
        run: |
          set -euo pipefail
          python tools/lint/check_diagram_manifest.py --root .

      # FR-021c, FR-011: Spec cross-reference coverage (001–037)
      - name: spec-cross-ref-check
        run: python tools/lint/check_spec_cross_refs.py

      # FR-023, SC-008: Known-gaps registry completeness
      - name: known-gaps-check
        run: python tools/lint/check_known_gaps.py
