name: ci

on:
  push:
    branches:
      - main
      - "001-disaster-response-hub"
      - "003-rubric-gap-closure"
      - "015-performance-benchmarks"
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - name: Validate workspace structure
        run: |
          test -f pyproject.toml
          test -f apps/api/pyproject.toml
          test -f apps/agents/pyproject.toml
          test -f apps/web/package.json
      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff pytest-benchmark pytest-asyncio
          pip install -e apps/api
          pip install -e apps/agents
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: python-test
        run: pytest tests/contract tests/integration

      - name: python-lint
        run: ruff check apps tests packages

      - name: ts-typecheck
        run: pnpm --filter ./apps/web exec tsc --noEmit

      - name: web-build
        run: pnpm --filter ./apps/web build

      - name: perf-benchmark
        timeout-minutes: 2
        continue-on-error: true
        run: pytest tests/benchmark/ --benchmark-json=.benchmarks/current.json -q

      - name: upload-benchmark-results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: .benchmarks/current.json
          retention-days: 30
