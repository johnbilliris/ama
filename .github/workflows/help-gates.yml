name: spec-038 — help build-time gates

on:
  pull_request:
    paths:
      - "apps/web/src/content/help/**"
      - "tools/help/**"
      - "specs/038-help-docs-chat/**"
  workflow_dispatch:

jobs:
  help-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install python deps
        run: pip install pydantic
      - name: Lint lang attributes
        run: python tools/help/lint_lang_attributes.py
      - name: Link checker
        run: python tools/help/link_checker.py
      - name: Screenshot freshness (register-only on PRs)
        run: |
          if [ -f tools/help/route_registry.json ] && [ -f tools/help/screenshot_baseline.json ]; then
            python tools/help/check_screenshot_freshness.py --registry tools/help/route_registry.json --baseline tools/help/screenshot_baseline.json
          else
            echo "registry/baseline absent on this PR; skipping (placeholders only)"
          fi
