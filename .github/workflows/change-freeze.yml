name: Change Freeze (Spec 029 — T062)

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [activate, deactivate, status]
        required: true
      reason:
        type: string
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ./tools/pipeline
      - run: |
          if [ "${{ inputs.action }}" = "activate" ]; then
            freeze-controller activate --reason "${{ inputs.reason }}"
          elif [ "${{ inputs.action }}" = "deactivate" ]; then
            freeze-controller deactivate
          else
            freeze-controller status
          fi
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(spec-029): freeze ${{ inputs.action }}"
          file_pattern: ".github/state/freeze.json"
