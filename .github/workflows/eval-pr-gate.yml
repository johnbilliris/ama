name: eval-pr-gate

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/agents/**"
      - "apps/eval-runner/**"
      - "packages/eval-core/**"
      - "specs/030-llm-eval-framework/**"
      - ".github/workflows/eval-pr-gate.yml"

permissions:
  contents: read
  pull-requests: write

env:
  AZURE_RUN_MODE: pr-fast-subset
  EVAL_RUN_REGION: australiaeast

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Per spec 031 / FR-019a: PR evals run against dev infrastructure; the
    # AZURE_CREDENTIALS secret resolves from the `dev` GitHub Environment.
    environment: dev
    steps:
      - name: Checkout
        uses: 93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - name: Setup Python
        uses: a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.0
        with:
          python-version: "3.12"

      - name: Install eval framework
        run: |
          pip install -e packages/eval-core
          pip install -e apps/eval-runner
          pip install pytest ruff

      - name: Lint
        run: |
          ruff check packages/eval-core/ apps/eval-runner/ tests/unit/eval/

      - name: Run unit tests
        run: |
          python -m pytest packages/eval-core/tests/ tests/unit/eval/ -q

      # Per spec 031: the job-level `environment: dev` binding ensures
      # AZURE_CREDENTIALS is always present when this job runs (this repo
      # does not accept fork PRs). The earlier `if: secrets.* != ''` guards
      # were both redundant and rejected by GitHub's runtime YAML validator
      # (secrets context is restricted in step-level `if:` expressions on
      # pull_request triggers). Removed.
      - name: Azure login
        uses: 2dd0bbf4064d5a1812889dc200bb8eed2597f82a # v3.x
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Trigger Container Apps Job
        id: trigger
        run: |
          set -euo pipefail
          RUN_ID=$(az containerapp job start \
            --name "${{ vars.EVAL_RUNNER_JOB_NAME }}" \
            --resource-group "${{ vars.EVAL_RG }}" \
            --env-vars "RUN_MODE=$AZURE_RUN_MODE" "PR_NUMBER=${{ github.event.pull_request.number }}" \
            --query "properties.startTime" -o tsv)
          echo "run_started_at=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Poll for verdict
        id: verdict
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            VERDICT=$(az containerapp job execution list \
              --name "${{ vars.EVAL_RUNNER_JOB_NAME }}" \
              --resource-group "${{ vars.EVAL_RG }}" \
              --query "[0].properties.template.containers[0].command" -o tsv || echo "running")
            STATUS=$(az containerapp job execution list \
              --name "${{ vars.EVAL_RUNNER_JOB_NAME }}" \
              --resource-group "${{ vars.EVAL_RG }}" \
              --query "[0].properties.status" -o tsv || echo "Running")
            if [ "$STATUS" = "Succeeded" ] || [ "$STATUS" = "Failed" ]; then
              echo "status=$STATUS" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 30
          done

      - name: Comment PR with scorecard summary
        if: always()
        uses: f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.x
        with:
          script: |
            const status = "${{ steps.verdict.outputs.status }}" || "skipped";
            const body = `## LLM eval gate\n\n` +
              `Status: **${status}**\n\n` +
              `_Triggered for PR #${context.issue.number}; full scorecard published to artifact storage._`;
            github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail job if eval failed
        if: steps.verdict.outputs.status == 'Failed'
        run: |
          echo "::error::eval-runner reported failure — see linked scorecard artifact."
          exit 1
