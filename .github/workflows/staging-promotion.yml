# Spec-036 Wave 4 — T-Z05 staging-promotion workflow.
#
# Runs the FR-063 SLI gate before promoting a build from staging to
# production. The static portion (KQL JSON + Bicep parity) is enforced
# by `tests/e2e/test_staging_promotion_gates.py`. The runtime portion
# (live KQL evaluation against Application Insights) is invoked at
# release-time via Azure CLI.
#
# This workflow does NOT promote on its own — it produces a green
# check that the release-promotion workflow in `.github/workflows/cd.yml`
# requires before tagging the staging→prod cutover.
name: staging-promotion

env:
  PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple
  UV_DEFAULT_INDEX: https://packagefeedproxy.microsoft.io/pypi/simple
  PIP_CONFIG_FILE: /dev/null
  PIP_EXTRA_INDEX_URL: ""
  PIP_FIND_LINKS: ""
  UV_INDEX: ""
  UV_EXTRA_INDEX_URL: ""
  UV_FIND_LINKS: ""
  UV_NO_CONFIG: "1"

# Cycle 3 / T-AA37 / Pass-1 Q3 (`spec.md:1016-1097`) — workflow-level
# concurrency block to QUEUE common-path dispatches rather than execute
# them in parallel. ``cancel-in-progress: false`` ensures every dispatch
# eventually runs (so two operators dispatching back-to-back both observe
# the gate); a queueing model is preferred over cancellation because each
# refused gate run produces a forensic audit envelope (T-AA40), and
# cancellation would suppress the second envelope. Cross-ref races
# (different refs) DO race; the cross-ref no-coalescing invariant is
# exercised by ``tests/integration/test_staging_promotion_concurrency.py``
# (T-AA41).
concurrency:
  group: "staging-promotion-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      app_insights_resource_id:
        description: "Application Insights component resource id (staging)"
        required: true
        type: string
      build_label:
        description: "Build label being promoted (e.g. v0.36.0-rc.1)"
        required: true
        type: string
  schedule:
    # Daily at 19:00 UTC (06:00 AEST next day) — keeps SLI gate evergreen.
    - cron: "0 19 * * *"

permissions:
  contents: read
  id-token: write   # OIDC for `azure/login@v2`

jobs:
  static-gate:
    name: SLI static gate (KQL parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.0
        with:
          python-version: "3.12"

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: SLI KQL + Bicep parity
        run: pytest tests/e2e/test_staging_promotion_gates.py -q --tb=short

  runtime-gate:
    name: SLI runtime gate (Application Insights)
    needs: [static-gate, smoke-injection]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: staging
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - name: Azure login
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Evaluate canonical SLI KQLs
        env:
          APP_INSIGHTS_ID: ${{ inputs.app_insights_resource_id }}
          BUILD_LABEL: ${{ inputs.build_label }}
        # Cycle 3 / T-AA35 / A3-01 / FR-071 (`spec.md:3625-3641`) —
        # bind the workflow exit code to the helper's
        # ``StagingPromotionRefused`` raise. The previous heredoc only
        # branched on ``proc.returncode != 0`` and emitted an
        # unconditional "All 7 SLIs within threshold — promotion
        # allowed." line on every successful return — silently ignoring
        # threshold breaches. The refactor:
        #   1. runs each SLI's canonical KQL via ``az monitor
        #      app-insights query``;
        #   2. collates the LATEST projected metric per SLI into the
        #      shape consumed by ``assert_sli_thresholds()``;
        #   3. delegates the threshold + sample-floor evaluation to
        #      ``tests/staging_gates.py::assert_sli_thresholds`` —
        #      the helper raises ``StagingPromotionRefused`` on any
        #      breach OR sample-floor underage AND writes the
        #      ``staging_promotion.refused`` audit envelope (T-AA40);
        #   4. propagates a non-zero exit so the workflow fails.
        # Documentary or visual-only logs do NOT satisfy FR-071 — the
        # audit envelope is the binding contract surface.
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          from tests.staging_gates import (
              StagingPromotionRefused,
              assert_sli_thresholds,
          )

          with open("infra/observability/sli-kql.json") as f:
              doc = json.load(f)

          # Z6 carries per-model cardinality (sub_agent × model_deployment);
          # collapse the rows into ``per_model`` keyed by deployment name.
          # Z7 emits ``model_deployment``-grouped rows; we aggregate by
          # taking the worst (lowest) drift_budget_pct across deployments
          # for a single conservative gate evaluation. Z1-Z5 evaluation is
          # left to the operational alerting path (SLI-1 / SLI-2 alerts);
          # the staging-promotion gate is Z6 + Z7 only per Cycle 2 SC-013.
          collated: dict[str, dict] = {"SLI-Z6": {"per_model": {}, "sample_count": 0}, "SLI-Z7": {}}

          for sli in doc["slis"]:
              sli_id = sli["id"]
              if sli_id not in {"SLI-Z6", "SLI-Z7"}:
                  continue
              proc = subprocess.run(
                  [
                      "az", "monitor", "app-insights", "query",
                      "--ids", os.environ["APP_INSIGHTS_ID"],
                      "--analytics-query", sli["kql"],
                      "-o", "json",
                  ],
                  capture_output=True, text=True, check=False,
              )
              if proc.returncode != 0:
                  print(f"{sli_id}: az query failed: {proc.stderr}", file=sys.stderr)
                  sys.exit(2)
              try:
                  table = json.loads(proc.stdout)["tables"][0]
                  cols = [c["name"] for c in table["columns"]]
                  rows = table["rows"]
              except (KeyError, IndexError, ValueError) as exc:
                  print(f"{sli_id}: malformed query response ({exc!r})", file=sys.stderr)
                  sys.exit(2)

              if sli_id == "SLI-Z6":
                  # Columns: sub_agent, model_deployment, p95_latency_ms, sample_count
                  for row in rows:
                      record = dict(zip(cols, row, strict=False))
                      deployment = record.get("model_deployment", "default")
                      collated["SLI-Z6"]["per_model"][deployment] = {
                          "p95_latency_ms": record.get("p95_latency_ms"),
                      }
                      collated["SLI-Z6"]["sample_count"] += int(record.get("sample_count", 0))
              else:
                  # SLI-Z7 columns: model_deployment, drift_budget_pct, sample_count
                  worst_pct = None
                  total_samples = 0
                  for row in rows:
                      record = dict(zip(cols, row, strict=False))
                      pct = record.get("drift_budget_pct")
                      if pct is not None and (worst_pct is None or pct < worst_pct):
                          worst_pct = pct
                      total_samples += int(record.get("sample_count", 0))
                  collated["SLI-Z7"] = {
                      "drift_budget_pct": worst_pct if worst_pct is not None else 100.0,
                      "sample_count": total_samples,
                  }

          try:
              assert_sli_thresholds(sli_results=collated)
          except StagingPromotionRefused as refused:
              print(f"STAGING PROMOTION REFUSED: {refused}", file=sys.stderr)
              # The helper has already written the
              # ``staging_promotion.refused`` audit envelope (T-AA40)
              # — a non-zero exit is the workflow-boundary contract.
              sys.exit(1)
          PY

  smoke-injection:
    # Cycle 2 / T-AA19 / A2-02 — synthetic smoke-injection job mitigates
    # CHK117 / CHK137 sample-size starvation. Injects ≥40 representative
    # signals (5 cascade-source categories × 8 each) into the dedicated
    # `tnt-stg-smoke` test tenant before the runtime-gate evaluates the
    # 24 h trailing-window Z6 + Z7 SLIs (gives a 33 % safety margin on
    # the 30-sample CLT floor). Runs as the `Simulation.Coordinator`
    # test identity so it does NOT pollute production-tenant SLIs.
    name: Synthetic smoke-injection (Z6/Z7 sample-floor)
    needs: [static-gate]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: staging
    env:
      SMOKE_TENANT_ID: tnt-stg-smoke
      SMOKE_IDENTITY: Simulation.Coordinator
      SMOKE_TARGET_PER_CATEGORY: 8
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - name: Azure login
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Inject 40 synthetic signals across 5 cascade-source categories
        env:
          # Cycle 3 / T-AA36 / A3-02 / FR-072 — `STAGING_API_BASE` is sourced
          # from a GitHub-environment secret bound to the ``staging``
          # environment (NOT a repository-level secret) so the staging
          # base URI cannot leak into production-environment workflow
          # runs. ``STAGING_API_AUDIENCE`` is the application id URI of
          # the staging API app registration; ``az account get-access-token
          # --resource <audience>`` exchanges the federated-credential
          # session for a short-lived bearer.
          STAGING_API_BASE: ${{ secrets.STAGING_API_BASE }}
          STAGING_API_AUDIENCE: ${{ secrets.STAGING_API_AUDIENCE }}
        # Cycle 3 / T-AA36 / A3-02 / FR-072 (`spec.md:3643-3658`) —
        # smoke-injection refactor. The previous loop constructed
        # payloads but only PRINTED them; it never invoked the
        # inject-telemetry endpoint, so the ``≥ 40 synthetic signals``
        # floor passed trivially (5 × 8 = 40 always) and no
        # ``customEvents`` rows accumulated. The 30-sample CLT floor was
        # therefore defeated in low-traffic staging. The refactor:
        #   1. acquires a short-lived OIDC bearer via
        #      ``az account get-access-token`` (federated credential —
        #      NO long-lived ``SMOKE_TOKEN``);
        #   2. POSTs each payload to
        #      ``{STAGING_API_BASE}/api/simulations/{sim_id}/inject-telemetry``;
        #   3. asserts HTTP 202 + ``degraded_dispatch=false`` per row;
        #   4. fails the job (non-zero exit) on any HTTP failure.
        # NO ``SMOKE_TOKEN`` reference; NO unused ``import subprocess``
        # at the top of the heredoc.
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import uuid
          from datetime import UTC, datetime

          import requests

          # 5 cascade-source categories per spec.md FR-058 / pass-2 Q4.
          CATEGORIES = (
              "weather",
              "fire-behaviour",
              "hydrology",
              "transport",
              "evacuation-centre",
          )
          per_category = int(os.environ["SMOKE_TARGET_PER_CATEGORY"])
          tenant = os.environ["SMOKE_TENANT_ID"]
          api_base = os.environ["STAGING_API_BASE"].rstrip("/")
          audience = os.environ["STAGING_API_AUDIENCE"]

          # OIDC bearer acquisition — federated credential flow established
          # by ``azure/login@v2`` above; ``az account get-access-token``
          # exchanges that session for a short-lived bearer scoped to the
          # staging API app registration. PD-C3-03 mandates this flow;
          # ADR-031's MVP ``AZURE_CREDENTIALS`` fallback explicitly does
          # NOT apply here.
          token_proc = subprocess.run(
              ["az", "account", "get-access-token",
               "--resource", audience, "-o", "json"],
              capture_output=True, text=True, check=True,
          )
          bearer = json.loads(token_proc.stdout)["accessToken"]
          headers = {
              "Authorization": f"Bearer {bearer}",
              "Content-Type": "application/json",
          }

          # Each smoke-injection batch targets a stable per-tenant smoke
          # simulation id; the staging API stamps ``tenant_id`` and
          # ``env`` into the emitted ``customEvents`` rows.
          smoke_sim_id = os.environ.get("SMOKE_SIM_ID", "sim-stg-smoke")

          total = 0
          for category in CATEGORIES:
              for i in range(per_category):
                  payload = {
                      "signal_id": str(uuid.uuid4()),
                      "tenant_id": tenant,
                      "category": category,
                      "confidence": "high",
                      "parameters": {"seq": i},
                      "observed_at": datetime.now(UTC).isoformat(),
                      "freshness_window_seconds": 600,
                  }
                  url = f"{api_base}/api/simulations/{smoke_sim_id}/inject-telemetry"
                  response = requests.post(url, json=payload, headers=headers, timeout=30)
                  if response.status_code != 202:
                      print(f"smoke[{category}#{i}]: HTTP {response.status_code} "
                            f"!= 202 — {response.text}", file=sys.stderr)
                      sys.exit(1)
                  body = response.json()
                  if body.get("degraded_dispatch") is not False:
                      print(f"smoke[{category}#{i}]: degraded_dispatch != false "
                            f"({body!r})", file=sys.stderr)
                      sys.exit(1)
                  print(f"smoke[{category}#{i}]: 202 ok signal={payload['signal_id']}")
                  total += 1

          if total < 40:
              print(f"FATAL: smoke-injection injected only {total} signals "
                    "(< 40 floor; pass-2 Q4 requires ≥ 40 to maintain a "
                    "33 % margin over the 30-sample CLT floor).",
                    file=sys.stderr)
              sys.exit(1)
          print(f"smoke-injection complete: {total} signals across "
                f"{len(CATEGORIES)} categories")
          PY

  promote:
    name: Tag promotion candidate
    needs: [static-gate, smoke-injection, runtime-gate]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          fetch-depth: 0

      - name: Tag build for promotion
        run: |
          git tag -a "promote/${{ inputs.build_label }}" -m "SLI gate green for ${{ inputs.build_label }}"
          # Note: tag is created locally; release-promotion.yml is
          # the workflow that pushes it after final manual approval.
