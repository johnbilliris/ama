name: web-coverage-iteration

# Spec-034 FR-024 / Q5 — nightly tribunal cycle that drives the gap register
# toward Closed within 3 cycles. Triggers:
#   • cron at 02:00 AEST (16:00 UTC) every night.
#   • workflow_dispatch with optional gap_id input (force-run for one gap).
#   • pull_request closed against specs/034-** (re-evaluate after a merge).

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      gap_id:
        description: "Force-run a single gap-id (default: all open)"
        required: false
        type: string
  pull_request:
    types: [closed]
    paths:
      - "specs/034-**"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: web-coverage-iteration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  iterate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema
      - name: Download canonical artefacts from latest CI run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-coverage-canonical
          path: specs/034-webapp-capstone-coverage/
        continue-on-error: true  # bootstrap: first run has no artefact yet.
      - name: List open gaps
        id: list-gaps
        run: |
          set -euo pipefail
          forced='${{ inputs.gap_id }}'
          if [[ -n "$forced" ]]; then
            echo "gaps=$forced" >> "$GITHUB_OUTPUT"
          else
            python scripts/web-coverage/gap-register.py list \
              | jq -r '.[] | select(.status=="Open" or .status=="Reopened") | .gap_id' \
              | tr '\n' ' ' \
              | sed 's/[[:space:]]*$//' \
              > /tmp/open-gaps.txt
            echo "gaps=$(cat /tmp/open-gaps.txt)" >> "$GITHUB_OUTPUT"
          fi
      - name: Run review-log against agents
        if: steps.list-gaps.outputs.gaps != ''
        run: |
          set -euo pipefail
          # The actual per-agent vote step is delegated to the sub-agents under
          # .github/agents/_subagents/. The review-log CLI then aggregates votes
          # for the next cycle and emits diffs/cycle-N/{gap}.md stubs.
          for gap in ${{ steps.list-gaps.outputs.gaps }}; do
            for panel in operational sector technical; do
              python scripts/web-coverage/review-log.py panel \
                --panel "$panel" --cycle 1 \
              || echo "::warning title=review-log::panel '$panel' resolver failed for $gap"
            done
          done
      - name: Open follow-up PR
        if: steps.list-gaps.outputs.gaps != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet specs/034-webapp-capstone-coverage/; then
            echo "::notice title=web-coverage-iteration::no diffs to open as PR"
            exit 0
          fi
          branch="ama-bot/web-coverage-iter-$(date -u +%Y%m%d%H%M)"
          git config user.name  "ama-bot"
          git config user.email "ama-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add specs/034-webapp-capstone-coverage/
          git commit -m "chore(034): nightly tribunal iteration"
          git push origin "$branch"
          gh pr create \
            --title "chore(034): web-coverage iteration $(date -u +%Y-%m-%d)" \
            --body  "Auto-generated by .github/workflows/web-coverage-iteration.yml" \
            --base  main \
            --head  "$branch" \
            --label "spec:034" \
            --label "auto:web-coverage-iteration"
