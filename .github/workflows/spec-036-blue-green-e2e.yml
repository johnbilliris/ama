# Spec 036 / F-A10 / T222 — Nightly blue-green alias-flip E2E
# (FR-RAG-TEST-04 + FR-RAG-IDX-09 SLO).
#
# Cron: 16:00 UTC daily ≈ 0300 AEST / 0200 AEDT — runs after the
# `corpus-ingest` cron at 14:00 UTC has settled, so any newly-built
# `corpus-v{N+1}` image is ready to be flipped against.
#
# Triggers:
#   - schedule (16:00 UTC daily)
#   - workflow_dispatch (operator override)
name: Spec 036 Blue-Green E2E

env:
  PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple
  UV_DEFAULT_INDEX: https://packagefeedproxy.microsoft.io/pypi/simple
  PIP_CONFIG_FILE: /dev/null
  PIP_EXTRA_INDEX_URL: ""
  PIP_FIND_LINKS: ""
  UV_INDEX: ""
  UV_EXTRA_INDEX_URL: ""
  UV_FIND_LINKS: ""
  UV_NO_CONFIG: "1"

on:
  workflow_dispatch:
    inputs:
      against-staging:
        description: Hit staging Azure AI Search (1) or run hermetically (0)
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"

permissions:
  contents: read
  id-token: write

jobs:
  blue-green-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      AMA_E2E_AGAINST_STAGING: ${{ inputs.against-staging || '0' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.0
        with:
          python-version: "3.12"
      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install -e apps/api
          pip install -e apps/agents
      - name: Run blue-green E2E
        run: |
          pytest tests/e2e/test_blue_green_alias_flip.py -q --tb=short
      - name: Summary
        if: always()
        run: |
          {
            echo "## Spec 036 Blue-Green E2E"
            echo ""
            echo "- Mode: ${AMA_E2E_AGAINST_STAGING:-0} (1 = staging)"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
