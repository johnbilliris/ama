# Spec 036 T053 — Corpus ingest workflow (FR-RAG-IDX-05)
#
# Builds the ama/ingest-runner image, pushes it to ACR, and triggers the
# Container Apps Job ``caj-ingest-runner-${env}``. Emits the ``corpus_build_sha``
# as a workflow artefact so downstream jobs (cd.yml deploy) can stamp it on
# Container App revisions.
#
# Triggers:
#   - push to main with changes under docs/corpus/** (refresh on corpus changes)
#   - daily cron (catches publisher-side updates picked up by the corpus build pipeline)
#   - manual dispatch (operator override / dry-run smoke testing)
#
# Auth: AZURE_CREDENTIALS service principal (same as cd.yml — ADR-031).

name: Corpus Ingest (Spec 036)

on:
  push:
    branches: [main]
    paths:
      - "docs/corpus/**"
      - "apps/ingest-runner/**"
      - ".github/workflows/corpus-ingest.yml"
  schedule:
    # 18:00 UTC daily ≈ 04:00/05:00 AEST — quiet hours for AU East tenants.
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment (dev/staging/production)
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - production
      mode:
        description: Ingest mode
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - full
          - dry-run

permissions:
  contents: read
  id-token: write

jobs:
  ingest:
    name: Build + run corpus ingest
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.environment || 'dev' }}
    env:
      TARGET_ENV: ${{ inputs.environment || 'dev' }}
      INGEST_MODE: ${{ inputs.mode || 'incremental' }}
      AZURE_ENV_NAME: drh-${{ inputs.environment || 'dev' }}
      RESOURCE_GROUP: rg-drh-${{ inputs.environment || 'dev' }}
      JOB_NAME: caj-ingest-runner-${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          fetch-depth: 0  # required for git ls-tree to compute corpus_build_sha

      - name: Validate AZURE_CREDENTIALS present
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [[ -z "${AZURE_CREDENTIALS}" ]]; then
            echo "::error::AZURE_CREDENTIALS secret is missing for environment '${TARGET_ENV}'."
            exit 1
          fi

      - name: Azure Login
        uses: azure/login@2dd0bbf4064d5a1812889dc200bb8eed2597f82a # v3.x
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.x
        with:
          python-version: "3.12"

      - name: Compute corpus_build_sha
        id: build_sha
        run: |
          # Deterministic SHA over the canonical corpus tree.
          sha=$(git ls-tree -r HEAD docs/corpus | sha256sum | cut -d' ' -f1)
          echo "corpus_build_sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "  corpus_build_sha=${sha}"

      - name: Lint INDEXING-LICENCE-INVENTORY drift
        run: |
          python tools/lint/check_licence_inventory.py

      - name: Resolve ACR + push image
        id: build_image
        run: |
          ACR_NAME=$(az acr list \
            --resource-group "${RESOURCE_GROUP}" \
            --query "[0].name" -o tsv)
          if [[ -z "${ACR_NAME}" ]]; then
            echo "::error::No ACR found in ${RESOURCE_GROUP}"
            exit 1
          fi
          TAG="${{ steps.build_sha.outputs.corpus_build_sha }}"
          IMAGE="${ACR_NAME}.azurecr.io/ama/ingest-runner:${TAG}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

          az acr login --name "${ACR_NAME}"
          # Build + push from apps/ingest-runner/Dockerfile (created in Phase B impl).
          # ``az acr build`` runs the build server-side — the runner only needs
          # source files, not the Docker daemon.
          if [[ -f "apps/ingest-runner/Dockerfile" ]]; then
            az acr build --registry "${ACR_NAME}" \
              --image "ama/ingest-runner:${TAG}" \
              --file apps/ingest-runner/Dockerfile \
              .
          else
            echo "::warning::apps/ingest-runner/Dockerfile not yet present — skipping build (Phase B impl)"
          fi

      - name: Update Container Apps Job image
        if: steps.build_image.outputs.image != ''
        run: |
          az containerapp job update \
            --name "${JOB_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --image "${{ steps.build_image.outputs.image }}" \
            --set-env-vars "CORPUS_BUILD_SHA=${{ steps.build_sha.outputs.corpus_build_sha }}" \
            || echo "::warning::Job not yet provisioned in ${RESOURCE_GROUP} — first run may need azd up"

      - name: Run ingest-runner via seed_ingest.py
        env:
          AMA_INGEST_DRY_RUN: ${{ env.INGEST_MODE == 'dry-run' && '1' || '' }}
        run: |
          python scripts/seed_ingest.py \
            --resource-group "${RESOURCE_GROUP}" \
            --job-name "${JOB_NAME}" \
            --mode "${INGEST_MODE}" \
            --timeout-seconds 7200 \
            || { echo "::error::Ingest run failed"; exit 1; }

      - name: Upload corpus_build_sha artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.x
        with:
          name: corpus-build-sha-${{ env.TARGET_ENV }}
          path: |
            artifacts/corpus_build.manifest.json
          if-no-files-found: warn
          retention-days: 90

      - name: Summary
        run: |
          echo "## Corpus ingest summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: ${TARGET_ENV}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: ${INGEST_MODE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- corpus_build_sha: ${{ steps.build_sha.outputs.corpus_build_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ${{ steps.build_image.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
