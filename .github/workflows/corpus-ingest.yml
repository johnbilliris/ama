# Spec 036 T053 — Corpus ingest workflow (FR-RAG-IDX-05)
#
# Builds the ama/ingest-runner image, pushes it to ACR, and triggers the
# Container Apps Job ``caj-ingest-runner-${env}``. Emits the ``corpus_build_sha``
# as a workflow artefact so downstream jobs (cd.yml deploy) can stamp it on
# Container App revisions.
#
# Triggers:
#   - push to main with changes under docs/corpus/** (refresh on corpus changes)
#   - daily cron (catches publisher-side updates picked up by the corpus build pipeline)
#   - manual dispatch (operator override / dry-run smoke testing)
#
# Auth: AZURE_CREDENTIALS service principal (same as cd.yml — ADR-031).

name: Corpus Ingest (Spec 036)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment (dev/staging/production)
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - production
      mode:
        description: Ingest mode
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - full
          - dry-run

permissions:
  contents: read
  id-token: write

jobs:
  ingest:
    name: Build + run corpus ingest
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.environment || 'dev' }}
    env:
      TARGET_ENV: ${{ inputs.environment || 'dev' }}
      INGEST_MODE: ${{ inputs.mode || 'incremental' }}
      AZURE_ENV_NAME: drh-${{ inputs.environment || 'dev' }}
      RESOURCE_GROUP: rg-drh-${{ inputs.environment || 'dev' }}
      JOB_NAME: caj-ingest-runner-${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          fetch-depth: 0  # required for git ls-tree to compute corpus_build_sha

      - name: Validate AZURE_CREDENTIALS present
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [[ -z "${AZURE_CREDENTIALS}" ]]; then
            echo "::error::AZURE_CREDENTIALS secret is missing for environment '${TARGET_ENV}'."
            exit 1
          fi

      - name: Azure Login
        uses: azure/login@2dd0bbf4064d5a1812889dc200bb8eed2597f82a # v3.x
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.x
        with:
          python-version: "3.12"

      - name: Compute corpus_build_sha
        id: build_sha
        run: |
          # Deterministic SHA over the canonical corpus tree.
          sha=$(git ls-tree -r HEAD docs/corpus | sha256sum | cut -d' ' -f1)
          echo "corpus_build_sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "  corpus_build_sha=${sha}"

      - name: Lint INDEXING-LICENCE-INVENTORY drift
        run: |
          python tools/lint/check_licence_inventory.py

      # Spec 036 T213 — Nightly source drift detection. When invoked from the
      # 0 14 * * * UTC cron, short-circuit cheaply if no source.json has
      # changed since the last manifest. (Plan §F-A8.1)
      - name: Detect source drift
        id: drift
        if: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          drift=0
          if [[ -f "artifacts/corpus_build.manifest.json" ]]; then
            prev_sha=$(jq -r '.corpus_build_sha // ""' artifacts/corpus_build.manifest.json)
            cur_sha="${{ steps.build_sha.outputs.corpus_build_sha }}"
            if [[ "${prev_sha}" != "${cur_sha}" && -n "${prev_sha}" ]]; then
              drift=1
            fi
          else
            # No prior manifest -> treat as drift to bootstrap.
            drift=1
          fi
          if [[ "${drift}" -eq 0 ]]; then
            echo "::notice::no_drift_detected — skipping image build + ingest run"
            echo "no_drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "drift_detected=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve ACR + push image
        id: build_image
        run: |
          ACR_NAME=$(az acr list \
            --resource-group "${RESOURCE_GROUP}" \
            --query "[0].name" -o tsv)
          if [[ -z "${ACR_NAME}" ]]; then
            echo "::error::No ACR found in ${RESOURCE_GROUP}"
            exit 1
          fi
          TAG="${{ steps.build_sha.outputs.corpus_build_sha }}"
          IMAGE="${ACR_NAME}.azurecr.io/ama/ingest-runner:${TAG}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

          az acr login --name "${ACR_NAME}"
          # Build + push from apps/ingest-runner/Dockerfile (created in Phase B impl).
          # ``az acr build`` runs the build server-side — the runner only needs
          # source files, not the Docker daemon.
          if [[ -f "apps/ingest-runner/Dockerfile" ]]; then
            az acr build --registry "${ACR_NAME}" \
              --image "ama/ingest-runner:${TAG}" \
              --file apps/ingest-runner/Dockerfile \
              .
          else
            echo "::warning::apps/ingest-runner/Dockerfile not yet present — skipping build (Phase B impl)"
          fi

      - name: Update Container Apps Job image
        if: steps.build_image.outputs.image != ''
        run: |
          az containerapp job update \
            --name "${JOB_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --image "${{ steps.build_image.outputs.image }}" \
            --set-env-vars "CORPUS_BUILD_SHA=${{ steps.build_sha.outputs.corpus_build_sha }}" \
            || echo "::warning::Job not yet provisioned in ${RESOURCE_GROUP} — first run may need azd up"

      - name: Run ingest-runner via seed_ingest.py
        env:
          AMA_INGEST_DRY_RUN: ${{ env.INGEST_MODE == 'dry-run' && '1' || '' }}
        run: |
          python scripts/seed_ingest.py \
            --resource-group "${RESOURCE_GROUP}" \
            --job-name "${JOB_NAME}" \
            --mode "${INGEST_MODE}" \
            --timeout-seconds 7200 \
            || { echo "::error::Ingest run failed"; exit 1; }

      - name: Upload corpus_build_sha artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.x
        with:
          name: corpus-build-sha-${{ env.TARGET_ENV }}
          path: |
            artifacts/corpus_build.manifest.json
          if-no-files-found: warn
          retention-days: 90

      # Spec 036 T136 / FR-RAG-LS-02 — emit offline-cache bundle for Field
      # Coordinator devices. The bundle is dual-signed (cosign keyless + age
      # detached) and uploaded as both a workflow artefact (auditable) and a
      # blob to the offline-cache-bundles container (operationalised).
      - name: Build offline-cache bundle
        if: env.INGEST_MODE != 'dry-run'
        env:
          PYTHONIOENCODING: utf-8
          CORPUS_BUILD_SHA: ${{ steps.build_sha.outputs.corpus_build_sha }}
          EMBEDDING_MODEL_ID: ${{ vars.EMBEDDING_MODEL_ID || 'text-embedding-3-large' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/offline-cache
          # The ingest container writes ``artifacts/corpus_build.manifest.json``;
          # if that's missing (first-run / dry-run), skip with a warning so the
          # workflow doesn't hard-fail before the ingest job has populated state.
          if [[ ! -f "artifacts/corpus_build.manifest.json" ]]; then
            echo "::warning::corpus_build.manifest.json not present — skipping offline-bundle build"
            exit 0
          fi
          python -m ama_ingest.offline_bundle_cli \
            --chunks-manifest artifacts/corpus_build.manifest.json \
            --corpus-build-sha "${CORPUS_BUILD_SHA}" \
            --embedding-model-id "${EMBEDDING_MODEL_ID}" \
            --output artifacts/offline-cache/manifest.json \
            || { echo "::error::offline_bundle build failed"; exit 1; }

      - name: Sign offline-cache bundle (cosign keyless + age)
        if: env.INGEST_MODE != 'dry-run'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          if [[ ! -f "artifacts/offline-cache/manifest.json" ]]; then
            echo "::warning::no manifest to sign — skipping"
            exit 0
          fi
          # cosign keyless (Sigstore + GitHub OIDC; spec 032 FR-AI09 baseline).
          cosign sign-blob --yes \
            --output-signature artifacts/offline-cache/manifest.cosign.sig \
            artifacts/offline-cache/manifest.json \
            || { echo "::error::cosign sign-blob failed"; exit 1; }
          # age detached signature (R-07 fail-closed for offline verification).
          # Recipients live in `OFFLINE_CACHE_AGE_RECIPIENTS` (1+ public keys).
          if [[ -z "${OFFLINE_CACHE_AGE_RECIPIENTS:-}" ]]; then
            echo "::warning::OFFLINE_CACHE_AGE_RECIPIENTS not set — skipping age sign"
          else
            age --encrypt --armor \
              ${OFFLINE_CACHE_AGE_RECIPIENTS} \
              -o artifacts/offline-cache/manifest.age \
              artifacts/offline-cache/manifest.json \
              || { echo "::error::age encrypt failed"; exit 1; }
          fi
          # Verify locally as a smoke test (PowerShell verify-offline-cache.ps1
          # mirrors this on the Field Coordinator side).
          ls -la artifacts/offline-cache/

      - name: Upload offline-cache bundle artefact
        if: env.INGEST_MODE != 'dry-run'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.x
        with:
          name: offline-cache-${{ env.TARGET_ENV }}-${{ steps.build_sha.outputs.corpus_build_sha }}
          path: |
            artifacts/offline-cache/manifest.json
            artifacts/offline-cache/manifest.cosign.sig
            artifacts/offline-cache/manifest.age
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        run: |
          echo "## Corpus ingest summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: ${TARGET_ENV}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: ${INGEST_MODE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- corpus_build_sha: ${{ steps.build_sha.outputs.corpus_build_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ${{ steps.build_image.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
