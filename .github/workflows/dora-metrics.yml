name: dora-metrics

# Spec-032 FR-C04 — daily aggregator that computes DORA metrics from
# GitHub data and posts them to Application Insights customMetrics.
# Visualised by a Workbook (T816 doc + future workbook).

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # 30 min covers the actual ~30s workload plus any hosted-runner
    # provisioning delays (timeout-minutes includes queue-wait time).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v5.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.0
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install azure-monitor-opentelemetry opentelemetry-sdk requests

      - name: Aggregate + publish DORA metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
        run: python scripts/dora_metrics_publish.py
