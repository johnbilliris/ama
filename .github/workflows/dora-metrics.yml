name: dora-metrics

# Spec-032 FR-C04 — daily aggregator that computes DORA metrics from
# GitHub data and posts them to Application Insights customMetrics.
# Visualised by a Workbook (T816 doc + future workbook).

on:
  schedule:
    # 06:00 UTC daily (= 16:00 AEST)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install azure-monitor-opentelemetry opentelemetry-sdk requests

      - name: Aggregate + publish DORA metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
        run: python scripts/dora_metrics_publish.py
