name: security-scan

# FR-T04 + FR-S03 — supplementary security gates beyond CodeQL:
#  - gitleaks: secret scan (push + PR)
#  - PSRule for Bicep: IaC policy scan
#  - Trivy: container vulnerability scan (Dockerfile-only on PR; image-scan in CD)

on:
  push:
    branches: [main, dev, staging, production]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.x
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: Verify Gitleaks emulator exceptions
        run: python3 scripts/verify_emulator_secret_exceptions.py gitleaks

  psrule-bicep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          persist-credentials: false
      - name: Install Bicep CLI
        uses: anthony-c-martin/setup-bicep@faf8170f496c10a2ea75977d2e77024131331404 # v1
        with:
          version: 0.48.1
      - name: Run PSRule for Azure (Bicep)
        uses: microsoft/ps-rule@46451b8f5258c41beb5ae69ed7190ccbba84112c # v2.9.0
        with:
          modules: PSRule.Rules.Azure
          inputType: repository
          inputPath: infra/
          baseline: Azure.Default

  trivy-fs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          persist-credentials: false
      - name: Trivy filesystem scan (Dockerfile + IaC)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SECRET_CONFIG: trivy-secret.yaml
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Verify Trivy emulator exceptions
        run: python3 scripts/verify_emulator_secret_exceptions.py trivy
