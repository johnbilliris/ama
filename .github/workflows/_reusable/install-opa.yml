name: install-opa
description: |
  T006 — Reusable composite installing OPA + conftest on ubuntu-22.04, pinned to
  SHA, cached by version. Prints versions for evidence pack inclusion.

inputs:
  opa-version:
    description: OPA release tag (e.g., v0.65.0).
    required: false
    default: v0.65.0
  conftest-version:
    description: Conftest release tag (e.g., v0.50.0).
    required: false
    default: v0.50.0

runs:
  using: composite
  steps:
    - name: Cache OPA + conftest binaries
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.local/bin/opa
          ~/.local/bin/conftest
        key: opa-${{ inputs.opa-version }}-conftest-${{ inputs.conftest-version }}-linux

    - name: Install OPA (pinned)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ~/.local/bin
        # Pinned via the open-policy-agent/setup-opa@v2 SHA mapping documented in install-opa.yml
        curl -fsSL "https://github.com/open-policy-agent/opa/releases/download/${{ inputs.opa-version }}/opa_linux_amd64_static" -o ~/.local/bin/opa
        chmod +x ~/.local/bin/opa

    - name: Install conftest (pinned)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/${{ inputs.conftest-version }}/conftest_${{ inputs.conftest-version }}_Linux_x86_64.tar.gz" -o /tmp/conftest.tgz
        tar -xzf /tmp/conftest.tgz -C ~/.local/bin conftest
        chmod +x ~/.local/bin/conftest

    - name: Add to PATH
      shell: bash
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Print versions for evidence
      shell: bash
      run: |
        opa version
        conftest --version
