name: PR Gates (Spec 029 — T029)

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: false
        default: dev
    secrets:
      AZURE_TENANT_ID:
        required: true
      AZURE_CLIENT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: pr-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oidc-and-topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: oidc
        uses: ./.github/actions/setup-oidc-azure
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          environment: ${{ inputs.environment }}

  posture:
    needs: oidc-and-topology
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-opa
      - name: opa fmt + test (rego suite)
        run: |
          opa fmt --diff infra/policy/rego/
          opa test infra/policy/rego/ tests/pipeline/contract/fixtures/ -v
      - name: conftest — posture, cross-env, secret-hygiene, AU-region, identity-consistency
        run: |
          for fixture in tests/pipeline/contract/fixtures/*.json; do
            conftest test --policy infra/policy/rego/ \
              --data infra/policy/posture-matrix.yaml \
              --data infra/policy/posture-exceptions.yaml \
              --data infra/policy/foundry-carveout.yaml \
              "$fixture" || exit 1
          done

  python-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ./tools/pipeline[dev]
      - run: ruff check tools/pipeline
      - run: mypy --strict tools/pipeline/src
      - run: pytest tests/pipeline -q
