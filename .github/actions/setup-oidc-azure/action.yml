name: setup-oidc-azure
description: |
  T005 — Reusable composite that performs OIDC-federated `azure/login` (no creds:
  secret), validates the resolved AZURE_SUBSCRIPTION_ID against
  infra/IDENTITY.md::topology_subscription_ids[$env] (per ADR-029-01 / R16), and
  exports AMA_SUBSCRIPTION_TOPOLOGY for downstream audit-event stamping (T020a).

inputs:
  client-id:
    description: Entra workload identity client ID for the target environment.
    required: true
  tenant-id:
    description: Entra tenant ID.
    required: true
  subscription-id:
    description: Resolved AZURE_SUBSCRIPTION_ID for the target environment.
    required: true
  environment:
    description: Target environment (dev|staging|production).
    required: true
  identity-file:
    description: Path to infra/IDENTITY.md (the trust root).
    required: false
    default: infra/IDENTITY.md
  audit-emitter:
    description: Path to the audit-emitter CLI on the runner PATH.
    required: false
    default: audit-emitter

runs:
  using: composite
  steps:
    - name: Validate environment input
      shell: bash
      run: |
        case "${{ inputs.environment }}" in
          dev|staging|production) ;;
          *) echo "::error::invalid environment '${{ inputs.environment }}'"; exit 1 ;;
        esac

    - name: OIDC login to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ inputs.client-id }}
        tenant-id: ${{ inputs.tenant-id }}
        subscription-id: ${{ inputs.subscription-id }}

    - name: Assert IDENTITY.md topology consistency (ADR-029-01 / R16)
      id: assert-topology
      shell: bash
      env:
        ENV_NAME: ${{ inputs.environment }}
        IDENTITY_FILE: ${{ inputs.identity-file }}
        OBSERVED_SUB: ${{ inputs.subscription-id }}
      run: |
        set -euo pipefail
        if [ ! -f "$IDENTITY_FILE" ]; then
          echo "::error file=$IDENTITY_FILE::IDENTITY.md missing — cannot assert topology"
          exit 1
        fi
        python3 - <<'PY'
        import os, sys, json
        try:
            import yaml
        except ImportError:
            sys.stderr.write("PyYAML missing on runner; install with `pip install pyyaml`\n")
            sys.exit(2)
        path = os.environ["IDENTITY_FILE"]
        env  = os.environ["ENV_NAME"]
        obs  = os.environ["OBSERVED_SUB"]
        text = open(path, encoding="utf-8").read()
        if not text.startswith("---"):
            sys.stderr.write(f"IDENTITY.md missing YAML front-matter\n")
            sys.exit(1)
        _, fm, _ = text.split("---", 2)
        meta = yaml.safe_load(fm) or {}
        topology = meta.get("subscription_topology")
        expected = (meta.get("topology_subscription_ids") or {}).get(env)
        if not expected:
            sys.stderr.write(f"identity_consistency_no_mapping: IDENTITY.md missing topology_subscription_ids[{env}]\n")
            sys.exit(1)
        if obs != expected:
            obs_tail = obs[-4:]; exp_tail = expected[-4:]
            sys.stderr.write(
                f"identity_consistency_topology_mismatch: ADR-029-01 / R16 — "
                f"observed AZURE_SUBSCRIPTION_ID ending …{obs_tail} does NOT match "
                f"IDENTITY.md::topology_subscription_ids[{env}] ending …{exp_tail}\n"
            )
            print(f"AMA_TOPOLOGY_MISMATCH=1", file=open(os.environ["GITHUB_OUTPUT"], "a"))
            sys.exit(1)
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
            f.write(f"AMA_SUBSCRIPTION_TOPOLOGY={topology}\n")
        print(f"identity_consistency: OK (topology={topology}, env={env})")
        PY

    - name: Emit audit event on mismatch
      if: failure() && steps.assert-topology.outputs.AMA_TOPOLOGY_MISMATCH == '1'
      shell: bash
      run: |
        ${{ inputs.audit-emitter }} \
          --action gate.decision \
          --outcome denied \
          --rationale identity_consistency_topology_mismatch \
          --environment ${{ inputs.environment }} || true
