name: setup-cosign-syft
description: |
  T007 — Install Sigstore Cosign + Anchore Syft pinned to SHAs for build-once /
  sign / SBOM (FR-004, FR-005). Configures keyless signing identity via OIDC.

inputs:
  cosign-version:
    description: Cosign release tag (e.g., v2.2.4).
    required: false
    default: v2.2.4
  syft-version:
    description: Syft release tag (e.g., v1.10.0).
    required: false
    default: v1.10.0

runs:
  using: composite
  steps:
    - name: Install Cosign (pinned)
      uses: sigstore/cosign-installer@v3.5.0
      with:
        cosign-release: ${{ inputs.cosign-version }}

    - name: Install Syft (pinned)
      uses: anchore/sbom-action/download-syft@v0.17.0
      with:
        syft-version: ${{ inputs.syft-version }}

    - name: Enable keyless signing
      shell: bash
      run: echo "COSIGN_EXPERIMENTAL=1" >> "$GITHUB_ENV"

    - name: Print versions for evidence
      shell: bash
      run: |
        cosign version
        syft version
