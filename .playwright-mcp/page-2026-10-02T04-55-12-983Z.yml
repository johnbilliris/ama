                    - generic [ref=f1e184]:
                      - term [ref=f1e185]: Where is my data hosted?
                      - definition [ref=f1e186]: All telemetry, signals, and operator state are processed and stored in Azure Australia regions. The hub enforces an AU-region guardrail across every page.
                    - generic [ref=f1e187]:
                      - term [ref=f1e188]: How do I report an incident or escalate?
                      - definition [ref=f1e189]: Open the Disaster Map, locate the relevant signal or sector, and use the Incident Commander workspace to raise an approval or warning. All decisions are captured to the audit trail.
                    - generic [ref=f1e190]:
                      - term [ref=f1e191]: What if I lose connectivity in the field?
                      - definition [ref=f1e192]: Field Coordinator workspaces and sector pages run an offline subsystem that queues critical actions and syncs once connectivity is restored.
                    - generic [ref=f1e193]:
                      - term [ref=f1e194]: Where can I see system health and constitutional gates?
                      - definition [ref=f1e195]: The Governance Dashboard surfaces all 10 constitutional gates, data freshness, degraded-mode posture, and compliance against AIDR + AIIMS principles.
