[extend]
useDefault = true

[allowlist]
description = "Opaque idempotency examples in the contract and deterministic privacy test are test data, not credentials."
regexTarget = "match"
paths = [
  '''^specs/036-sim-agent-extend/contracts/idempotency-cache\.md$''',
  '''^tests/contract/test_privacy_act_sar\.py$''',
]
regexes = [
  '''Idempotency-Key:\s+[A-Za-z0-9._:-]+''',
  '''idem-key-123456''',
]
