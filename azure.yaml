# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: disaster-response-hub
metadata:
  template: disaster-response-hub@0.1.0

# ---------- Infrastructure ----------
infra:
  provider: bicep
  path: infra
  module: main

# ---------- Hooks ----------
hooks:
  preprovision:
    windows:
      shell: pwsh
      run: python ./scripts/purge_soft_deleted_dev_resources.py
      interactive: false
      continueOnError: false
    posix:
      shell: sh
      run: python3 ./scripts/purge_soft_deleted_dev_resources.py
      interactive: false
      continueOnError: false

  predown:
    windows:
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/remove-evidence-immutability-policy.ps1
      interactive: false
      continueOnError: false
    posix:
      shell: sh
      run: sh ./scripts/remove-evidence-immutability-policy.sh
      interactive: false
      continueOnError: false
  postdown:
    windows:
      shell: pwsh
      run: python ./scripts/purge_soft_deleted_dev_resources.py
      interactive: false
      continueOnError: false
    posix:
      shell: sh
      run: python3 ./scripts/purge_soft_deleted_dev_resources.py
      interactive: false
      continueOnError: false
  postprovision:
    windows:
      shell: pwsh
      run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/seed-database.ps1
      interactive: true
      continueOnError: false
    posix:
      shell: sh
      run: ./scripts/seed-database.sh
      interactive: true
      continueOnError: false

# ---------- Services ----------
services:
  api:
    project: ./apps/api
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      context: ../..
      platform: linux/amd64
      registry: ${AZURE_CONTAINER_REGISTRY_ENDPOINT}
      image: ama/api
      remoteBuild: true

  agents:
    project: ./apps/agents
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      context: ../..
      platform: linux/amd64
      registry: ${AZURE_CONTAINER_REGISTRY_ENDPOINT}
      image: ama/agents
      remoteBuild: true

  evacuation:
    project: ./apps/agents
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      context: ../..
      platform: linux/amd64
      registry: ${AZURE_CONTAINER_REGISTRY_ENDPOINT}
      image: ama/evacuation
      remoteBuild: true

  ingestion:
    project: ./apps/ingestion
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      context: ../..
      platform: linux/amd64
      registry: ${AZURE_CONTAINER_REGISTRY_ENDPOINT}
      image: ama/ingestion
      remoteBuild: true

  ingest-runner:
    project: .
    language: docker
    host: containerapp
    docker:
      path: ./apps/ingest-runner/Dockerfile
      context: .
      platform: linux/amd64
      registry: ${AZURE_CONTAINER_REGISTRY_ENDPOINT}
      image: ama/ingest-runner
      remoteBuild: true

  web:
    project: ./apps/web
    language: js
    host: appservice
    dist: .next/standalone-deploy
    config:
      packageManager: pnpm

# ---------- Pipeline ----------
pipeline:
  provider: github
