## Health Endpoint

### GET /health

Standard agent health endpoint (per project conventions).

**Response**: `200 OK`
```json
{
  "status": "healthy",
  "agent_version": "0.1.0",
  "timestamp": "2025-07-19T10:00:00Z",
  "checks": {
    "llm_connectivity": { "status": "configured", "last_checked_at": "...", "latency_ms": 0 },
    "cosmos_connectivity": { "status": "healthy", "container": "emergency-plans" },
    "plan_assembly_pipeline": { "status": "ready" }
  }
}
```

---

## Graceful Degradation

- If Cosmos DB unavailable: health endpoint returns `degraded`, plan reads return `503` with cached last-known plan (if available).
- If LLM unavailable: plan generation works without AI-assisted completeness suggestions; manual completeness checking still functional.
- If activated plan version conflicts with in-progress draft: activates last endorsed version (edge case handling).

## Observability Metrics

- `emergency_plan_activation_count` — Counter: plan activations per region
- `plan_currency_compliance_ratio` — Gauge: ratio of plans within review schedule
- `plan_section_completeness` — Gauge: average section completeness across active plans
