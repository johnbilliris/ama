# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
# JSON Schema describing the canonical structure of `infra/policy/posture-matrix.yaml`.
# Source of truth: spec.md FR-025, FR-026, FR-027, FR-028, FR-031, FR-032, FR-033.
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://ama/specs/029/contracts/posture-matrix.schema.yaml"
title: "Posture Matrix"
type: object
required: [version, last_reviewed, reviewing_personas, environments]
properties:
  version: { type: integer, minimum: 1 }
  last_reviewed: { type: string, format: date }
  reviewing_personas:
    type: array
    minItems: 2
    items: { type: string, pattern: "^@" }
    description: "MUST include both the security and the compliance personas."
  environments:
    type: array
    minItems: 3
    maxItems: 3
    items:
      type: object
      required: [name, regions, resource_group, naming_token, resource_types]
      properties:
        name: { type: string, enum: [dev, staging, production] }
        regions:
          type: array
          minItems: 1
          items: { type: string, enum: [australiaeast, australiasoutheast] }
        resource_group: { type: string, pattern: "^rg-ama-(dev|staging|prod)-(australiaeast|australiasoutheast)$" }
        naming_token: { type: string, pattern: "^\\*-(dev|staging|prod)-\\*$" }
        required_tags:
          type: object
          required: [environment]
          properties:
            environment: { type: string, enum: [dev, staging, production] }
        resource_types:
          type: array
          minItems: 1
          items:
            type: object
            required: [type, network, identity, secret]
            properties:
              type: { type: string, description: "Azure resource provider/type, e.g., Microsoft.DocumentDB/databaseAccounts" }
              network:
                type: object
                required: [public_access, private_endpoint_required]
                properties:
                  public_access: { type: string, enum: [allow, deny] }
                  private_endpoint_required: { type: boolean }
                  ip_allow_list:
                    type: array
                    items: { type: string, description: "CIDR" }
              identity:
                type: object
                required: [managed_identity_required, shared_key_disabled, local_auth_disabled]
                properties:
                  managed_identity_required: { type: boolean }
                  shared_key_disabled: { type: boolean }
                  local_auth_disabled: { type: boolean }
              secret:
                type: object
                required: [plain_secret_allowed, key_vault_reference_required]
                properties:
                  plain_secret_allowed: { type: boolean }
                  key_vault_reference_required: { type: boolean }
allOf:
  - description: "FR-027 — staging and production MUST forbid public access and shared keys where supported."
    if:
      properties:
        environments:
          contains:
            properties:
              name: { enum: [staging, production] }
    then: true
