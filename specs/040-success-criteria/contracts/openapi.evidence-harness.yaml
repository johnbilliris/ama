          title: X-Ama-Correlation-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditorSignoffRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditorSignoffResponse'
          headers:
            x-ama-correlation-id:
              description: Echoed client correlation ID or server-generated value.
              schema:
                type: string
        '422':
          description: Request validation failed.
          content:
            application/problem+json:
              schema:
