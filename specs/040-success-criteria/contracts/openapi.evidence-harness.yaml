components:
  schemas:
    Assumption:
      properties:
        id:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{2,63}$
          title: Id
        text:
          type: string
          minLength: 1
          title: Text
        resolved:
          type: boolean
          title: Resolved
          default: false
        review_state:
          type: string
          enum:
          - pending
          - validated
          - rejected
          title: Review State
          default: pending
        validation_method:
          type: string
          minLength: 1
          title: Validation Method
        evidence_required:
          type: string
          minLength: 1
          title: Evidence Required
        owner_role:
          type: string
          minLength: 1
          title: Owner Role
        review_due_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Review Due At
      additionalProperties: false
      type: object
      required:
      - id
      - text
      - validation_method
      - evidence_required
      - owner_role
      title: Assumption
    AuditEntry:
      properties:
        id:
          type: string
          maxLength: 128
          minLength: 1
          title: Id
        audit_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Audit Id
        value_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Value Id
        kind:
          type: string
          enum:
          - signal_ingested
          - model_output_recorded
          - recommendation_recorded
          - human_decision_recorded
          - outcome_recorded
          - scorecard_published
          - ladder_version_published
          - non_au_signal_refused
          - manual_share_blocked
          - auditor_signoff_recorded
          - kpi_amendment_recorded
          - degraded_mode_entered
          - small_sample_labelled
          - divergence_flagged
          - audit_mutation_attempted
          - language_fallback_used
          title: Kind
        actor:
          type: string
          maxLength: 256
          minLength: 1
          title: Actor
        occurred_at:
          type: string
          format: date-time
          title: Occurred At
        references:
