# API Contract: Recovery Tracking

**Base path**: `/api/incidents/{incident_id}/recovery`  
**FRs**: FR-032–037, SC-005  
**Service**: Recovery Service (platform API)  
**Auth**: Existing platform auth (Recovery Coordinator, Incident Controller, or community access for FR-037)

---

## Endpoints

### POST /api/incidents/{incident_id}/recovery

**New** — Initialise recovery tracking for an incident.

**Request body**:
```json
{
  "recovery_principles_applied": ["understand_context", "community_led"],
  "community_input_summary": "Initial community consultation held in Lismore on 2025-07-18"
}
```

**Response**: `201 Created`
```json
{
  "tracker_id": "rt-a1b2c3d4",
  "incident_id": "inc-2025-003",
  "status": "active",
  "created_at": "2025-07-20T16:00:00Z",
  "indicators": [],
  "recovery_principles_applied": ["understand_context", "community_led"]
}
```

**Side effects**: Initialises empty indicator slots for all 21 AIDR-defined indicators.

### GET /api/incidents/{incident_id}/recovery/dashboard

