**Response**: `200 OK`
```json
{
  "tracker_id": "rt-a1b2c3d4",
  "incident_id": "inc-2025-003",
  "status": "active",
  "environments": {
    "social": {
      "indicators": [
        {"indicator_name": "wealth", "value": 0.65, "unit": "index", "baseline_value": 1.0, "target_value": 0.9, "is_regressed": false, "last_updated_at": "2025-07-19T10:00:00Z", "update_source": "manual", "data_classification": "sensitive", "population_coverage": 15000},
        {"indicator_name": "employment", "value": 0.72, "unit": "ratio", "baseline_value": 0.95, "target_value": 0.85, "is_regressed": false, "last_updated_at": "2025-07-19T10:00:00Z", "update_source": "manual", "data_classification": "sensitive", "population_coverage": 15000}
      ],
