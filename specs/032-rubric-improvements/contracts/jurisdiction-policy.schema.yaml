# JurisdictionPolicy YAML schema (FR-AG02 + FR-AG05)
# Files live at infra/parameters/jurisdiction-policies/<code>.yaml and are loaded into Cosmos at deploy time.

$schema: https://json-schema.org/draft/2020-12/schema
title: JurisdictionPolicy
type: object
required: [jurisdiction_code, autonomy_level, language_priorities, version, effective_from, approved_by]
properties:
  jurisdiction_code:
    type: string
    pattern: "^(act|nsw|vic|qld|sa|wa|tas|nt|commonwealth)$"
  autonomy_level:
    type: string
    enum: [low, standard, high]
    description: Overrides environment default. `low` reserved for life-safety windows declared by IC/Executive.
  kill_switch_overrides:
    type: object
    description: Per-agent forced kill-switch state. Empty by default.
    additionalProperties: { type: boolean }
  language_priorities:
    type: array
    minItems: 1
    items:
      type: string
      pattern: "^[a-z]{2,3}(-[A-Z][a-zA-Z]{1,7})*(-[A-Z]{2})?$"  # BCP-47
    description: First-match-wins for outbound public messaging.
  aiims_role_overrides:
    type: object
    description: Map AIIMS function (control, intelligence, planning, operations, logistics, public_information) to agent_id.
    additionalProperties: { type: string }
  version:
    type: integer
    minimum: 1
  effective_from:
    type: string
    format: date-time
  approved_by:
    type: string
    minLength: 3

example: |
  jurisdiction_code: nsw
  autonomy_level: standard
  kill_switch_overrides:
    monitoring: false
    risk_assessment: false
  language_priorities:
    - en-AU
    - zh-Hans
    - ar
    - vi
    - el
    - it
  aiims_role_overrides:
    public_information: communication
  version: 7
  effective_from: 2026-04-30T00:00:00Z
  approved_by: johnbilliris
