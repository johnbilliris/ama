# Foundry Carve-Out Registry (FR-AI03a, ADR-033, spec 036 FR-RAG-CV-01..04)
#
# Lists underlying Foundry model identifiers, not deployment aliases. CD MUST
# refuse to deploy any model NOT present here, any deployment whose
# region falls outside Australian data-residency (australiaeast,
# australiasoutheast), and any deployment whose review_date is past or more
# than 12 months in the future.
#
# Normal approval floors remain in force unless the explicit, unexpired
# quorum_waiver below applies. Model review windows are not waived.
# Validated by:
#   - infra/policy/rego/foundry_carveout.rego (OPA, T025)
#   - scripts/verify-carveout.ps1 (CD step, T024 / T026)

version: 1
last_reviewed: 2026-10-20
reviewer_quorum: 2

quorum_waiver:
  scope: all_environments
  approved_by: johnbilliris
  approval_reference: "Project-lead instruction on 2026-10-20: skip the second approver requirement; confirmed scope All environments and reviewDeadline 2030-11-20."
  expires_on: 2030-11-20

# The spec-041 Dev row uses the explicit waiver. Existing spec-036
# approval records below it are retained unchanged.
deployments:
  - model_name: gpt-5.4
    region: australiaeast
    environment: dev
    purpose: production
    business_justification: "Spec 041 preserves the existing Dev reasoning, drafting and simulation deployments hosting gpt-5.4; project-lead approval and the explicit quorum waiver apply. This does not attest to AU-only GlobalStandard inference or authorise deployment."
    approver_identities:
      - johnbilliris
    review_date: 2027-04-08
    data_minimisation_required: true
    classification_filter_required: true

  - model_name: gpt-4o-mini
    region: australiaeast
    purpose: production
    business_justification: "Spec 036 FR-RAG-FM-01 — drafting tier for all five MAF agents and the Simulation controller (NN-2 §3 carve-out for in-AU Foundry deployment)."
    approver_identities:
      - johnbilliris
      - security-reviewer-team
    review_date: 2027-04-08
    data_minimisation_required: true
    classification_filter_required: true

  - model_name: gpt-4o
    region: australiaeast
    purpose: production
    business_justification: "Spec 036 FR-RAG-FM-01 — reasoning tier for life-safety decision paths across the named agents (NN-2 §3 carve-out for in-AU Foundry deployment)."
    approver_identities:
      - johnbilliris
      - security-reviewer-team
    review_date: 2027-04-08
    data_minimisation_required: true
    classification_filter_required: true

  - model_name: text-embedding-3-large
    region: australiaeast
    purpose: production
    business_justification: "Spec 036 FR-RAG-IN-02 — embedding model for blue-green AI Search index ingest (corpus chunk vectorisation; NN-2 §3 carve-out scope)."
    approver_identities:
      - johnbilliris
      - security-reviewer-team
    review_date: 2027-04-08
    data_minimisation_required: true
    classification_filter_required: true
