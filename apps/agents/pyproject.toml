[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ama-disaster-response-agents"
version = "0.1.0"
description = "Specialist agent workers for the disaster response hub"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10.0",
  "azure-identity>=1.19.0",
  "azure-monitor-opentelemetry>=1.6.0",
  "openai>=1.68.0",
  "tenacity>=9.0.0",
  "azure-cosmos>=4.9.0",
  "azure-servicebus>=7.13.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.34.0",
  "pytest-benchmark>=5.1.0",
  "locust>=2.32.0",
  "shapely>=2.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["common", "monitoring", "risk_assessment", "evacuation", "resource_allocation", "communication"]
