[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ama-disaster-response-agents"
version = "0.1.0"
description = "Specialist agent workers for the disaster response hub"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10.0",
  "azure-identity>=1.19.0",
  "azure-monitor-opentelemetry==1.8.7",
  "openai>=1.68.0",
  "tenacity>=9.0.0",
  "azure-cosmos>=4.9.0",
  "azure-servicebus>=7.13.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.34.0",
  "pytest-benchmark>=5.1.0",
  "locust>=2.32.0",
  "shapely>=2.0.0",
  "azure-communication-sms>=1.1.0",
  "numpy>=1.26.0",
  "cryptography>=46.0.7",
  "Pygments>=2.20.0",
  "requests>=2.33.0",
  "azure-ai-contentsafety>=1.0.0",
  "azure-iot-device>=2.12.0",
  "httpx>=0.27.0",
  "agent-framework>=1.2.2",
  "agent-framework-openai>=1.2.2",
  "agent-framework-azure-cosmos>=1.0.0b260429",
  "mcp>=1.27.0",
  # Spec 036 — Foundry RAG grounding (FR-RAG-FM-01..07, FR-RAG-CV-03, R-01).
  "azure-ai-inference>=1.0.0b9",            # Foundry chat client seam (replaces openai.AzureOpenAI).
  "azure-search-documents>=11.5.2",         # Shared retrieval client (FR-RAG-AG-01).
  "aiohttp>=3.9.0",                         # Async transport for azure.search.documents.aio.SearchClient (FR-RAG-AG-01).
  "presidio-analyzer>=2.2.355",             # PII redaction at the model gateway (FR-RAG-CV-03).
  "presidio-anonymizer>=2.2.355",           # PSPF redaction transform (FR-RAG-CV-03).
  # Spec 036 / F-A11 / T233 — OTel observability (FR-RAG-OBS-01..03).
  # Upper-bounded to <1.41 because azure-monitor-opentelemetry-exporter (transitive
  # via azure-monitor-opentelemetry==1.8.7 above) imports `LogData` which was
  # removed in opentelemetry-sdk 1.41.0. Without the cap pip resolves
  # azure-monitor-opentelemetry==1.8.2 + exporter b45 + sdk 1.41 → ImportError at
  # startup (ca-agents-ama crash 2026-05-12 azd-deploy-1778546871).
  "opentelemetry-sdk>=1.27,<1.41",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<1.41",
]

[tool.hatch.build.targets.wheel]
packages = ["common", "dispatcher", "monitoring", "risk_assessment", "evacuation", "resource_allocation", "communication", "maf_runtime"]
