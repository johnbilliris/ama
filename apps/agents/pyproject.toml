[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ama-disaster-response-agents"
version = "0.1.0"
description = "Specialist agent workers for the disaster response hub"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10.0",
  "azure-identity>=1.19.0",
  "azure-monitor-opentelemetry>=1.6.0",
  "openai>=1.68.0",
  "tenacity>=9.0.0",
  "azure-cosmos>=4.9.0",
  "azure-servicebus>=7.13.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.34.0",
  "pytest-benchmark>=5.1.0",
  "locust>=2.32.0",
  "shapely>=2.0.0",
  "azure-communication-sms>=1.1.0",
  "numpy>=1.26.0",
  "cryptography>=46.0.7",
  "Pygments>=2.20.0",
  "requests>=2.33.0",
  "azure-ai-contentsafety>=1.0.0",
  "azure-iot-device>=2.12.0",
  "httpx>=0.27.0",
  "agent-framework>=1.2.2",
  "agent-framework-openai>=1.2.2",
  "agent-framework-azure-cosmos>=1.0.0b260429",
  "mcp>=1.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["common", "monitoring", "risk_assessment", "evacuation", "resource_allocation", "communication", "maf_runtime"]
