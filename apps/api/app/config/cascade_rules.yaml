# Cascade rules (T-D03 / FR-057)
# ------------------------------
# Byte-deterministic 5-step affinity ladder per data-model.md:268-288.
# Loaded by ``apps/api/app/services/simulation/cascade_affinity_ladder.py``;
# the ordered list of step names below MUST stay in lock-step with the
# enum used in the ``cascade.degraded_to_annotation`` audit entry.

ladder:
  - jurisdiction_match
  - hazard_class_match
  - cascade_origin_thread
  - most_recent_mutation
  - thread_creation_ascending

cap: 5

