[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ama-disaster-response-api"
version = "0.1.0"
description = "FastAPI orchestration service for the disaster response hub"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "uvicorn>=0.32.0",
  "azure-identity>=1.19.0",
  "openai>=1.68.0",
  "tenacity>=9.0.0",
  "pytest-benchmark>=5.1.0",
  "locust>=2.32.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
