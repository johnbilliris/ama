[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ama-disaster-response-api"
version = "0.1.0"
description = "FastAPI orchestration service for the disaster response hub"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "uvicorn>=0.32.0",
  "azure-identity>=1.19.0",
  "azure-cosmos>=4.9.0",
  "azure-storage-blob>=12.24.0",
  "azure-mgmt-appcontainers>=3.1.0",
  "azure-monitor-opentelemetry>=1.6.0",
  "openai>=1.68.0",
  "tenacity>=9.0.0",
  "pytest-benchmark>=5.1.0",
  "locust>=2.32.0",
  "cryptography>=46.0.7",
  "Pygments>=2.20.0",
  "requests>=2.33.0",
  "jsonschema>=4.23.0",
  "shapely>=2.0.0",
  "PyJWT[crypto]>=2.9.0",
  "httpx>=0.27.0",
  "azure-keyvault-certificates>=4.9.0",
  "azure-keyvault-keys>=4.10.0",
  "python-jose[cryptography]>=3.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
