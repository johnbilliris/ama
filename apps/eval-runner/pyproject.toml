[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ama-eval-runner"
version = "0.1.0"
description = "AMA LLM Evaluation Framework runner — Container Apps Job that executes evaluation runs against Microsoft Foundry models"
requires-python = ">=3.12"
dependencies = [
  "ama-eval-core",
  "azure-ai-evaluation>=1.0.0",
  "azure-ai-inference>=1.0.0b9",
  "azure-ai-projects>=1.0.0b6",
  "azure-identity>=1.19.0",
  "azure-cosmos>=4.9.0",
  "azure-storage-blob>=12.24.0",
  # Pinned to ==1.8.7 (transitively pins opentelemetry-sdk==1.40 + exporter
  # ~=1.0.0b49 which uses ReadableLogRecord). With a loose floor pip resolves
  # an older azure-monitor-opentelemetry whose exporter still imports
  # `LogData` (removed in opentelemetry-sdk 1.41) → ImportError at startup.
  # See ca-agents-ama crash 2026-05-12 (azd-deploy-1778546871).
  "azure-monitor-opentelemetry==1.8.7",
  "azure-mgmt-resource>=23.1.0",
  "azure-mgmt-cognitiveservices>=13.5.0",
  "presidio-analyzer>=2.2.355",
  "presidio-anonymizer>=2.2.355",
  "pydantic>=2.10.0",
  "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ama_eval"]
