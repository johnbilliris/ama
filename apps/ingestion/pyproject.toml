[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ama-disaster-response-ingestion"
version = "0.1.0"
description = "Background ingestion worker for the disaster response hub"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "httpx>=0.28.0",
  "lxml>=5.3.0",
  "jsonschema>=4.23.0",
  "azure-cosmos>=4.9.0",
  "azure-storage-blob>=12.24.0",
  "azure-identity>=1.19.0",
  "azure-monitor-opentelemetry>=1.6.0",
  "opentelemetry-api>=1.20.0",
  "redis>=5.2.0",
  "redis-entraid>=0.3.0",
  "cryptography>=46.0.7",
  "requests>=2.33.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pipelines", "normalisers", "simulation"]
