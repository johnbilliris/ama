[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ama-eval-dataset"
version = "0.1.0"
description = "AMA disaster-response evaluation dataset content + tooling (generation, sanitisation, manifesting)"
requires-python = ">=3.12"
dependencies = [
  "ama-eval-core",
  "presidio-analyzer>=2.2.355",
  "presidio-anonymizer>=2.2.355",
  "jsonschema>=4.23.0",
  "pydantic>=2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ama_eval_dataset"]
